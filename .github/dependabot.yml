version: 2
updates:
  # GitHub Actions — keeps the SHA-pinned `uses:` fresh (the pins in
  # .github/workflows/* are immutable commit SHAs for supply-chain safety;
  # Dependabot bumps them + updates the trailing `# vX` comment). Grouped so a
  # weekly bump is one PR, not one-per-action.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # npm — every TS workspace package (each has its own node_modules; not an npm
  # workspace). Previously only /ts/engine was covered.
  - package-ecosystem: "npm"
    directories:
      - "/ts/engine"
      - "/ts/compiler"
      - "/ts/encoder"
      - "/ts/shared"
      - "/ts/cli"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7.0 ships no programmatic compiler API ("While TypeScript 7.0
      # is here, it does not ship with an API. We expect TypeScript 7.1 to ship
      # with a new (and different) API" -
      # https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/,
      # section "Running Side-by-Side with TypeScript 6.0").
      # ts/encoder drives the TS Compiler API directly and ts/compiler goes
      # through ts-morph, so a 7.0 bump cannot build. 7.1+ is NOT ignored:
      # Dependabot offers it once the new API exists (owner decision 2026-10-17,
      # closing #314/#315/#316).
      - dependency-name: "typescript"
        versions: ["7.0.x"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # pub — the Dart pub-workspace root resolves every dart/ package.
  - package-ecosystem: "pub"
    directory: "/dart"
    schedule:
      interval: "weekly"
    groups:
      pub-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # cargo — the Rust workspace root (rust/Cargo.toml) resolves every rust/
  # crate.
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # nuget — Central Package Management (csharp/Directory.Packages.props)
  # resolves every csharp/ package's NuGet versions from one root directory,
  # like the pub/cargo workspace roots above.
  - package-ecosystem: "nuget"
    directory: "/csharp"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
