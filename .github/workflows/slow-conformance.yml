name: Slow Conformance (subprocess round-trip)

# `dart/compiler/test/` has three suites tagged `@Tags(['slow'])`
# (conformance_roundtrip_test.dart, cross_language_test.dart,
# cross_language_fuzz_test.dart) that drive the conformance corpus through
# REAL subprocesses — `dart run` (engine + recompiled Dart + the
# encoder-in-the-loop round-trip) and `node` (the TS compiler) — rather than
# the in-process legs the normal CI suites use. ci.yml, regression-gates.yml,
# and release.yml all pass `--exclude-tags slow` for speed, so none of them
# ever exercise the real subprocess legs.
#
# HISTORY: while this leg ran ONLY on the weekly schedule (no PR trigger), it
# went red TWICE with no PR to point at: #305 (closed) rotted five fixtures on
# the dart-compiled/dart-roundtrip legs, and a second, independent recurrence
# — four DIFFERENT fixtures (#880, closed) — went undetected from at least
# 2026-09-07 through every weekly run after, because nothing ran these exact
# legs on the PRs that introduced the regressions. `pull_request` below closes
# that gap going forward: a PR touching the Dart compiler or encoder — the
# only two packages whose output these subprocess legs can move — now runs
# this exact suite before merge, not up to a week later. (A change to
# dart/engine or dart/shared can also move the `engine`/`ts-compiled` legs,
# but conformance-matrix.yml's in-process `engine` row and its own `*-compiled`
# rows already gate those paths on every PR; it is specifically the Dart
# COMPILER and ENCODER — the two components the real `dart run` subprocess legs
# exercise and the in-process matrix does not — that had no PR gate at all.)
on:
  schedule:
    - cron: "0 7 * * 1" # Weekly on Monday at 07:00 UTC (after conformance-matrix.yml's 06:00 run)
  pull_request:
    paths:
      - "dart/compiler/**"
      - "dart/encoder/**"
      # The gate must cover changes to ITSELF too (mirrors
      # conformance-matrix.yml's "the matrix must gate changes to ITSELF",
      # #642) — a PR that only edits this workflow's own test-invocation step
      # would otherwise get no run of the suite it just changed.
      - ".github/workflows/slow-conformance.yml"
  workflow_dispatch:

# Least-privilege: read-only token (this workflow only builds + runs tests).
permissions:
  contents: read

concurrency:
  group: slow-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow-conformance:
    name: Dart Compiler — slow subprocess round-trip (dart run + node)
    runs-on: ubuntu-latest
    # Generous budget: 319+ conformance programs each spawn several `dart
    # run`/`node` child processes across multiple slow-tagged suites: the
    # corpus round-trip has its own internal 2-hour timeout.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Cache Dart pub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('dart/**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      # The ts-compiled leg shells out to `node` running the built
      # @ball-lang/compiler CLI, so both toolchains are required here (unlike
      # most single-stack CI jobs).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/compiler/package-lock.json

      # The pub workspace root is the repo root (see pubspec.yaml); this
      # resolves every dart/ package.
      - name: Install dependencies
        run: dart pub get

      - name: Install & build @ball-lang/compiler
        run: cd ts/compiler && npm ci && npm run build

      - name: Run slow subprocess round-trip suites
        run: cd dart/compiler && dart test -t slow --reporter expanded
