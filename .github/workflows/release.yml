name: Release

# ─────────────────────────────────────────────────────────────────────────────
# RELEASE VIA PR (issue #755). The `Protect main` ruleset (17056238) started
# requiring 19 status checks on every push to `main` itself on 2026-09-13, and
# the old shape — `npx semantic-release` pushing its version-bump commit and
# tag straight to `main` — hits that rejection (GH013) unconditionally, every
# time: see docs/RELEASE.md's "Release via PR" section for the full design and
# the GitHub-docs citations behind it.
#
# The release job now runs in two independent phases EVERY push, in order:
#   Phase 1 (tools/release/open_release_pr.sh) computes the next version via a
#     semantic-release DRY RUN (no push, no tag — see that script's header),
#     and if there is one, opens-or-refreshes an auto-merging PR carrying the
#     version-bump commit on a `release/next` branch. No tag, no GitHub
#     Release, no publish dispatch happens here.
#   Phase 2 (tools/release/finish_release.sh) detects whether THIS push's HEAD
#     is a release PR that just merged, and ONLY then tags it, creates the
#     GitHub Release, and (below) dispatches the four downstream publish
#     workflows. A push that isn't a release-PR merge is a true no-op here.
# Phase 1 computing "nothing new" is what keeps this loop-free: the merge
# commit's own subject (`chore(release): X.Y.Z`) carries no conventional-commit
# type semantic-release's commit-analyzer treats as releasable, so the SAME
# run's phase 1 proposes nothing for it and phase 2 is the only one that acts.
#
# `workflow_dispatch`'s `dry_run` input rehearses the computation on ANY branch
# with zero side effects (no branch push, no PR, no tag, no release, no
# dispatch) — the same shape go-release.yml/pubdev-release.yml already use.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only (no branch push, no PR, no tag, no release, no publish dispatch). Leave ON unless rehearsing a change to this workflow against a branch about to become main."
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  packages: write
  # gh workflow run (npm-publish dispatch after a release is cut)
  actions: write

jobs:
  # ──────────────────────────────────────────────────
  # Run all tests before releasing
  # ──────────────────────────────────────────────────
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          setup_only: true

      - name: Proto lint
        run: buf lint proto/

      - name: Proto format check
        run: buf format proto/ --diff --exit-code

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Dart install dependencies
        run: cd dart && dart pub get

      - name: Dart analyze
        run: dart analyze dart/

      - name: Dart shared tests
        run: cd dart/shared && dart test

      - name: Dart engine tests
        run: cd dart/engine && dart test

      - name: Dart encoder tests
        run: cd dart/encoder && dart test

      - name: Dart compiler tests
        run: cd dart/compiler && dart test --exclude-tags slow

      - name: Dart resolver tests
        run: cd dart/resolver && dart test

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/engine/package-lock.json

      - name: TypeScript install dependencies
        run: cd ts/engine && npm ci

      - name: TypeScript build
        run: cd ts/engine && npm run build

      - name: TypeScript test
        run: cd ts/engine && npm test

  # ──────────────────────────────────────────────────
  # Semantic Release — via PR (issue #755, see this file's header)
  # ──────────────────────────────────────────────────
  release:
    name: Semantic Release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Credentials ARE persisted (the default) here, unlike the old
          # single-phase flow: tools/release/open_release_pr.sh and
          # finish_release.sh push a branch and a tag with plain `git push`,
          # not through a plugin that manages its own auth.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/release/package-lock.json

      - name: Install release toolchain
        run: cd tools/release && npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A push to main always runs for real. A workflow_dispatch defaults to
      # a side-effect-free rehearsal (dry_run input defaults true) and must be
      # told `-f dry_run=false` to act — the same opt-in shape
      # go-release.yml/pubdev-release.yml already use.
      - name: Decide dry-run vs real
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rehearsal — show what Phase 1 would compute (dry run only)
        if: steps.cfg.outputs.dry_run != 'false'
        run: node tools/release/compute_next_release.mjs

      # Phase 1: compute the next version (semantic-release dry run) and
      # open/refresh an auto-merging PR carrying the version bump. No tag, no
      # GitHub Release, no publish dispatch here — see the script's header.
      - name: Phase 1 — open/refresh the auto-merging release PR
        if: steps.cfg.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/release/open_release_pr.sh

      # Phase 2: detect whether THIS push's HEAD is a release PR that just
      # merged, and if so tag it + create the GitHub Release. `is_release`
      # drives the four downstream dispatches below.
      - name: Phase 2 — finish a release PR that just merged
        id: finish
        if: steps.cfg.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/release/finish_release.sh

      # npm publishing runs in publish-npm.yml (OIDC trusted publishing, no
      # token). Its `release: published` trigger never fires for releases
      # created here: events produced with the default GITHUB_TOKEN do not
      # trigger workflows (GitHub recursion protection) — npm silently froze
      # at 0.2.x for months because of this. Dispatch it explicitly instead,
      # pinned to the fresh release tag (same proven pattern as
      # release-tag.yml → release-publish.yml).
      - name: Dispatch npm publish for the new release
        if: steps.finish.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-npm.yml --ref "v${{ steps.finish.outputs.version }}"

      # Same recursion-protection issue as npm publish above: Phase 2 already
      # created the GitHub Release + `vX.Y.Z` tag using this step's
      # GITHUB_TOKEN, so release-cpp.yml's `release: published` trigger will
      # never fire for it. Dispatch it explicitly, pinned to the fresh tag
      # (issue #368).
      - name: Dispatch C++ binary release for the new release
        if: steps.finish.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release-cpp.yml --ref "v${{ steps.finish.outputs.version }}"

      # Go modules are consumed straight from the module proxy — a
      # `go/<module>/vX.Y.Z` tag IS the release, and that tag's VERSION is its
      # own line, not this repo's.
      #
      # This step used to dispatch tag-go-modules.yml directly, pinned to the
      # fresh `vX.Y.Z` tag. That made the TAGGING automatic but left the
      # VERSIONING manual: the tagger only ever cuts the version already written
      # into the `go/*/go.mod` files, so until a human ran
      # `bump_go_modules.sh` in a `chore(go):` PR, every release re-ran it and it
      # idempotently reported "all six tags already exist, nothing to do" — a
      # pass, indistinguishable from a healthy lane, while `go install …@latest`
      # stayed on v0.1.0. go-release.yml now computes that version with
      # semantic-release from `go/`-path commits and dispatches the tagger
      # itself, from `.github/release/go.releaserc.json`'s publishCmd (#361).
      #
      # `--ref main`, not the vX.Y.Z tag the three dispatches above use, and for
      # the same reason as the pub.dev dispatch below: those build a released
      # tree, this one RUNS semantic-release, whose @semantic-release/git step
      # pushes commits and tags to a BRANCH. It runs after this job's own push
      # has landed, and shares a concurrency group with pubdev-release.yml so
      # the two never push to main at once.
      - name: Dispatch the Go module release
        if: steps.finish.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run go-release.yml --ref main

      # The nine Dart packages release on their OWN per-package version lines
      # (`<pkg>-vX.Y.Z`), so this dispatch carries no repo version — each
      # package's semantic-release config computes its own from its own tag.
      # It is guarded on Phase 2's is_release purely as a "did this push just
      # merge a release PR" signal: the root config analyses every commit, so
      # a feat/fix touching dart/ always cuts a repo release too, and a push
      # that cuts none has nothing for the Dart lane either.
      #
      # `--ref main`, not the vX.Y.Z tag the three dispatches above use: those
      # build a released tree, this one RUNS semantic-release, whose
      # @semantic-release/git step pushes commits and tags to a BRANCH. It runs
      # after this step so it never races this job's own push to main.
      #
      # This replaced the Melos rolling-release-PR lane, whose one human step
      # (squash-merging that PR) stopped happening for two months while every
      # automated part of it stayed green (#551).
      - name: Dispatch the pub.dev per-package release
        if: steps.finish.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pubdev-release.yml --ref main
