  #
  # Then add to the summary job:
  #   1. Add "<lang>-engine" to the needs: array
  #   2. Add a print_row call for the new engine
  #   3. Add a failure check in the exit-code block

  # ──────────────────────────────────────────────────
  # C# Compiler leg — Ball → C# → Roslyn → run, per fixture (#452)
  #
  # A COMPILE leg, not an engine leg, and deliberately gated as a RATCHET
  # rather than a parity gate. The Ball → C# compiler does not yet cover the
  # whole language: at the floor below it emits 246 of 320 fixtures correctly.
  # Gating it at full parity would just hold main red; leaving it unrun (the
  # status quo this closes) left the gap UNMEASURED, which is worse — an
  # unmeasured gap regresses silently.
  #
  # So: run it every time, report the honest count, fail only if the count goes
  # DOWN. Raise CSHARP_COMPILER_FLOOR as each family lands — the job prints the
  # exact new value when it sees an improvement.
  #
  # Needs no Dart bootstrap and no -p:SelfHost=true: the leg compiles each
  # fixture with CSharpCompiler + Roslyn in-memory and runs it, never touching
  # the self-hosted engine. It is independent of the regen chain the
  # csharp-engine row depends on, so it is cheap and cannot be broken by it.
  # ──────────────────────────────────────────────────
  csharp-compiler:
    name: C# Compiler Leg (ratcheted)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Fixtures the Ball → C# compiler currently emits correctly. NEVER lower
      # this to turn a red build green — preventing exactly that is the whole
      # point of a ratchet. Open families are catalogued in #452.
      #
      # 248 is main's own value (#510). This branch restores fixture 406
      # (406_subclass_field_over_getter), which the C# compiler already handles
      # (#461 taught it this exact shape), so the measured count rises by one;
      # the floor is re-ratcheted from this branch's own dispatched matrix run,
      # never from memory. 431 and 432 do NOT compile on this leg yet and are
      # correctly NOT counted; Rust/Go/Python measured no change and keep theirs.
      CSHARP_COMPILER_FLOOR: "250"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build conformance harness
        run: dotnet build csharp/engine/conformance/Ball.Engine.Conformance.csproj -c Release

      - name: Run compiler leg
        id: conformance
        run: |
          cd csharp
          set +e
          output=$(dotnet run --project engine/conformance/Ball.Engine.Conformance.csproj -c Release --no-build -- --leg=compiler 2>&1)
          exit_code=$?
          echo "$output"

          # Parse counts from the FINAL `Results:` line ONLY — never a global
          # grep over all output. A leg's own progress chatter can contain a
          # second match (the Rust leg prints "320 fixtures emitted Rust, 0
          # failed to compile"), which makes `grep -oP` return a MULTILINE
          # value, splits the echo, and makes GITHUB_OUTPUT reject the write.
          # Same summary-anchored idiom regression-gates.yml uses for dart test.
          summary=$(echo "$output" | grep -E '^Results: [0-9]+ passed' | tail -1 || true)
          passed=$(echo "$summary" | grep -oP 'Results: \K\d+(?= passed)' | tail -1 || true)
          failed=$(echo "$summary" | grep -oP ', \K\d+(?= failed)'  | tail -1 || true)
          total=$(echo "$summary"  | grep -oP ', \K\d+(?= total)'   | tail -1 || true)

          # Assert each count is a single bare integer. A MULTILINE value would
          # make `[ "$passed" -lt "$FLOOR" ]` error with exit 2 — and a failing
          # `[` in an `if` SKIPS the branch, so the script would fall through to
          # `exit 0`: a silently disabled gate. tail -1 above makes that
          # unreachable; this asserts it rather than trusting it.
          for v in "$passed" "$failed" "$total"; do
            case "$v" in
              ''|*[!0-9]*)
                echo "::error::Could not parse a clean integer count from the Results line (got '$v'). Refusing to report a number this gate cannot trust."
                exit 1;;
            esac
          done
          passed=${passed:-0}; failed=${failed:-0}; total=${total:-0}

          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "total=$total"   >> "$GITHUB_OUTPUT"
          echo "floor=$CSHARP_COMPILER_FLOOR" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=== C# Compiler Leg ==="
          echo "Results: $passed passed, $failed failed, $total total (floor: $CSHARP_COMPILER_FLOOR)"

          # A harness that printed nothing must never read as a silent pass
          # (#439/#444). The ratchet floor below is >= 1 by construction, but
          # keep the parse guard explicit and separate from it.
          if [ "$exit_code" != "0" ] && [ "$total" -lt 1 ]; then
            echo "::error::The compiler leg crashed without reporting a Results line — it measured nothing"
            exit 1
          fi
          if [ "$total" -lt 1 ]; then
            echo "::error::Could not parse a Results line from the compiler leg — it ran no fixtures"
            exit 1
          fi

          if [ "$passed" -lt "$CSHARP_COMPILER_FLOOR" ]; then
            echo "::error::C# compiler leg REGRESSED: $passed passed, below the floor of $CSHARP_COMPILER_FLOOR — a fixture that used to compile no longer does"
            exit 1
          fi

          if [ "$passed" -gt "$CSHARP_COMPILER_FLOOR" ]; then
            echo "::notice::C# compiler leg IMPROVED: $passed passed (floor was $CSHARP_COMPILER_FLOOR). Raise CSHARP_COMPILER_FLOOR to $passed in this workflow to lock the gain in."
          fi
          exit 0

    outputs:
      passed: ${{ steps.conformance.outputs.passed }}
      failed: ${{ steps.conformance.outputs.failed }}
      total: ${{ steps.conformance.outputs.total }}
      floor: ${{ steps.conformance.outputs.floor }}

  # ──────────────────────────────────────────────────
  # C# round-trip leg — MEASUREMENT ONLY, NO FLOOR (#452 item 1)
  #
  # Ball fixture -> C# (Ball.Compiler) -> re-encode that C# back to Ball
  # (Ball.Encoder / Roslyn) -> run the RE-ENCODED program on the DART reference
  # engine -> diff the golden. Running it on the C# engine would only prove the
  # C# pipeline agrees with itself.
  #
  # #452's item 1 reads "Wire `--leg=compiler` (and `--leg=roundtrip`) into the
  # csharp CI/matrix jobs". PR #459 wired and ratcheted the compiler half; the
  # roundtrip half was dropped without comment. `RoundTripLeg.cs` has existed
  # and been dispatchable from Program.cs the whole time, but
  # `grep -n "leg=roundtrip" .github/workflows/*.yml` returned ZERO matches, so
  # its measured result lived only as prose in .claude/rules/csharp.md — and the
  # harness could fail to compile, throw, or start reporting a wrong count with
  # no CI signal whatsoever. This row makes that number live.
  #
  # NO FLOOR GATE, deliberately: the honest baseline is 0/320 BY CONSTRUCTION.
  # The compiler emits a flat class dispatching through `BallRuntime.*` calls
  # over `BallValue`; the syntactic Roslyn encoder targets idiomatic hand-written
  # C# and rejects those shapes (`unsupported method call `.ArgGet(...)``,
  # `new BallList(...) targets an unknown type`, …). A ratchet on 0 is
  # meaningless. What this job DOES gate is harness health: a `Results:` line
  # must be produced, its counts must be bare integers, and total must be >= 1.
  # The leg's own exit code is EXPECTED to be non-zero while fixtures fail.
  # ──────────────────────────────────────────────────
  csharp-roundtrip:
    name: C# Round-Trip Leg (measurement)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Ground truth is the Dart CLI: the leg shells out to
      # `dart run dart/cli/bin/ball.dart run <reencoded.ball.json>` per fixture,
      # so the Dart workspace has to be resolved even though today every fixture
      # fails earlier, at the re-encode step.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Bootstrap Dart workspace (reference engine)
        run: dart pub get

      - name: Build conformance harness
        run: dotnet build csharp/engine/conformance/Ball.Engine.Conformance.csproj -c Release

      - name: Run round-trip leg
        id: conformance
        run: |
          cd csharp
          set +e
          output=$(dotnet run --project engine/conformance/Ball.Engine.Conformance.csproj -c Release --no-build -- --leg=roundtrip --dart=dart 2>&1)
          exit_code=$?
          echo "$output"

          # Parse the FINAL `Results:` line ONLY — never a global grep over all
          # output. A multiline capture makes `[ "$total" -lt 1 ]` exit 2, and a
          # failing `[` inside an `if` SKIPS the branch and falls through to
          # exit 0: the gate would be silently DISABLED. `tail -1` makes that
          # unreachable; the integer guard below asserts it rather than trusting
          # it. (This leg's line carries a trailing " (N skipped carve-outs)"
          # suffix — the `(?= total)` lookahead is unaffected.)
          summary=$(echo "$output" | grep -E '^Results: [0-9]+ passed' | tail -1 || true)
          passed=$(echo "$summary" | grep -oP 'Results: \K\d+(?= passed)' | tail -1 || true)
          failed=$(echo "$summary" | grep -oP ', \K\d+(?= failed)'  | tail -1 || true)
          total=$(echo "$summary"  | grep -oP ', \K\d+(?= total)'   | tail -1 || true)

          for v in "$passed" "$failed" "$total"; do
            case "$v" in
              ''|*[!0-9]*)
                echo "::error::Could not parse a clean integer count from the Results line (got '$v'). Refusing to report a number this gate cannot trust."
                exit 1;;
            esac
          done

          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "total=$total"   >> "$GITHUB_OUTPUT"

          echo ""
          echo "=== C# Round-Trip Leg (measurement only — no floor) ==="
          echo "Results: $passed passed, $failed failed, $total total"

          # Positive floor. A harness that printed nothing, or discovered no
          # fixtures, must NEVER read as a silent pass (#439/#444) — and since
          # this leg has no ratchet, this is the ONLY thing standing between
          # "the harness rotted" and a green job.
          if [ "$total" -lt 1 ]; then
            echo "::error::The round-trip leg reported no fixtures (total=$total) — it measured nothing. Exit code was $exit_code."
            exit 1
          fi

          {
            echo "### C# round-trip leg (measurement only — issue #452 item 1)"
            echo ""
            echo "**$passed/$total** fixtures round-trip Ball -> C# -> Ball -> Dart engine."
            echo ""
            echo "No floor is enforced: 0/$total is the expected baseline (the compiler emits"
            echo "\`BallRuntime.*\`-shaped C# the syntactic Roslyn encoder does not recognise)."
            echo "This row exists to keep the number live and to catch the harness itself breaking."
          } >> "$GITHUB_STEP_SUMMARY"

          # The leg's own exit code is expected to be non-zero while fixtures
          # fail; it is reported, not gated on.
          echo "round-trip leg exit code: $exit_code (non-zero is expected at the current baseline)"
          exit 0

    outputs:
      passed: ${{ steps.conformance.outputs.passed }}
      failed: ${{ steps.conformance.outputs.failed }}
      total: ${{ steps.conformance.outputs.total }}

  # ──────────────────────────────────────────────────
  # Round-trip legs for Python / Go / Rust (#452 item 3) — MEASUREMENT ONLY.
  #
  # Same shape and the same rationale as `csharp-roundtrip` above, in the three
  # remaining self-hosted-compiler targets. Each one does, per fixture:
  #   Ball -> <lang> (that language's compiler)
  #        -> Ball   (that language's own encoder)
  #        -> run the RE-ENCODED program on the DART reference engine
  #        -> byte-diff the golden.
  # Running it on the language's own engine would only prove the pipeline agrees
  # with itself; Dart is the ground truth.
  #
  # NO FLOOR GATE, deliberately: a near-zero baseline is honest and expected
  # BY CONSTRUCTION. Every one of these compilers emits a flat program
  # dispatching through its own runtime's helpers over its own Ball-value type,
  # a shape none of the syntactic/AST-based encoders was built to re-parse.
  # A ratchet on 0 is meaningless. What these jobs DO gate is harness health: a
  # `Results:` line must be produced, its counts must be bare integers, and
  # total must be >= 1. Each leg's own exit code is EXPECTED to be non-zero
  # while fixtures fail.
  #
  # NOT A PR GATE, and that is the actual limitation, not a softening: this
  # workflow has NO `pull_request:` trigger, so these rows run on push-to-main,
  # the weekly schedule, or manual dispatch only. On a PR they are ABSENT, and
  # an absent check reads as green — always `gh workflow run
  # conformance-matrix.yml --ref <branch>` and read the run before merging a
  # change to any of them.
  # ──────────────────────────────────────────────────
  python-roundtrip:
    name: Python Round-Trip Leg (measurement)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Ground truth is the Dart CLI: the leg shells out to
      # `dart run dart/cli/bin/ball.dart run <reencoded.ball.json>` per fixture
      # that survives re-encoding, so the Dart workspace has to be resolved even
      # though today every fixture fails earlier.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Bootstrap Dart workspace (reference engine)
        run: dart pub get

      - name: Install dependencies
        run: python -m pip install "protobuf>=5.29"

      # Reads goldens and subprocess stdout as BYTES and normalizes only \r\n.
      # Text mode collapses a lone \r, which silently corrupts golden
      # comparison in BOTH directions — it has bitten two harnesses here.
      - name: Run round-trip leg
        id: conformance
        run: |
          set +e
          output=$(python -m python.engine.conformance.roundtrip 2>&1)
          exit_code=$?
          echo "$output"

          # Parse the FINAL `Results:` line ONLY — never a global grep over all
          # output. A multiline capture makes `[ "$total" -lt 1 ]` exit 2, and a
          # failing `[` inside an `if` SKIPS the branch and falls through to
          # exit 0: the gate would be silently DISABLED. `tail -1` makes that
          # unreachable; the integer guard below asserts it rather than trusting
          # it. (This leg's line carries a trailing " (N skipped carve-outs)"
          # suffix — the `(?= total)` lookahead is unaffected.)
          summary=$(echo "$output" | grep -E '^Results: [0-9]+ passed' | tail -1 || true)
          passed=$(echo "$summary" | grep -oP 'Results: \K\d+(?= passed)' | tail -1 || true)
          failed=$(echo "$summary" | grep -oP ', \K\d+(?= failed)'  | tail -1 || true)
          total=$(echo "$summary"  | grep -oP ', \K\d+(?= total)'   | tail -1 || true)

          for v in "$passed" "$failed" "$total"; do
            case "$v" in
              ''|*[!0-9]*)
                echo "::error::Could not parse a clean integer count from the Results line (got '$v'). Refusing to report a number this gate cannot trust."
                exit 1;;
            esac
          done

          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "total=$total"   >> "$GITHUB_OUTPUT"

          echo ""
          echo "=== Python Round-Trip Leg (measurement only — no floor) ==="
          echo "Results: $passed passed, $failed failed, $total total"

          # Positive floor. A harness that printed nothing, or discovered no
          # fixtures, must NEVER read as a silent pass (#439/#444) — and since
          # this leg has no ratchet, this is the ONLY thing standing between
          # "the harness rotted" and a green job.
          if [ "$total" -lt 1 ]; then
            echo "::error::The round-trip leg reported no fixtures (total=$total) — it measured nothing. Exit code was $exit_code."
            exit 1
          fi

          {
            echo "### Python round-trip leg (measurement only — issue #452 item 3)"
            echo ""
            echo "**$passed/$total** fixtures round-trip Ball -> Python -> Ball -> Dart engine."
            echo ""
            echo "No floor is enforced: 0/$total is the expected baseline (the compiler emits"
            echo "\`ballrt.*\`-shaped Python the syntactic \`ast\` encoder does not recognise)."
            echo "This row exists to keep the number live and to catch the harness itself breaking."
          } >> "$GITHUB_STEP_SUMMARY"

          # The leg's own exit code is expected to be non-zero while fixtures
          # fail; it is reported, not gated on.
          echo "round-trip leg exit code: $exit_code (non-zero is expected at the current baseline)"
          exit 0

    outputs:
      passed: ${{ steps.conformance.outputs.passed }}
      failed: ${{ steps.conformance.outputs.failed }}
      total: ${{ steps.conformance.outputs.total }}

