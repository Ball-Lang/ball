      # The self-hosted engine is a Ball program compiled through python/compiler,
      # so regenerate engine.ball.json (Dart) then compiled_engine.py
      # (ball_engine.regen) first — same regen chain as ci.yml's python job (see
      # python/engine/AGENTS.md).
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Regenerate self-hosted engine
        run: |
          dart pub get
          cd dart && dart run compiler/tool/gen_engine_json.dart
