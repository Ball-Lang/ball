# The macro-expansion fixture crate (issue #629).
#
# Like `counter_crate`/`modgraph_crate` it is a real crate that nothing ever
# builds with cargo — `rust/encoder/tests/macro_expansion.rs` walks it — so it
# is listed in `rust/Cargo.toml`'s `exclude`.
#
# Unlike those two it DOES carry a dependency, because the dependency is the
# point: `mini_bitflags` is the `#[macro_export] macro_rules!`-exporting crate
# the encoder must find through `cargo metadata`. It is a PATH dependency so
# that resolution needs no registry and no network.

# An EMPTY `[workspace]` table, which makes this package its own workspace root.
#
# `rust/Cargo.toml`'s `exclude` is not enough on its own — measured: with
# `encoder/tests/fixtures/macro_crate` already in that `exclude` array, running
# any cargo command here still fails with "current package believes it's in a
# workspace when it's not" (the same is true of the pre-existing
# `counter_crate`, which nothing ever runs cargo on, so it never showed).
# This fixture IS run through `cargo metadata` — that is how the encoder finds
# `mini_bitflags`' exported macros — so it needs the standalone-root marker
# cargo's own error message names.
[workspace]

[package]
name = "macro_crate"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
mini_bitflags = { path = "../mini_bitflags" }
