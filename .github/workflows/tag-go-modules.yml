name: Tag Go modules

# ──────────────────────────────────────────────────
# Go modules — the six `go/<module>/vX.Y.Z` tags (issue #361)
# ──────────────────────────────────────────────────
# The Go module proxy serves each nested module as its own tree, keyed by a
# `go/<module>/vX.Y.Z` tag, and every intra-repo `require` in go/*/go.mod names
# that exact version. So all six tags must land on ONE commit, together, or a
# dependent resolves to a version that does not exist.
#
# The version is NOT the Dart/Melos release version: the Go modules carry their
# own line (v0.1.0 first), single-sourced from the go.mod files themselves —
# build_local_proxy.py --print-version asserts all six agree and that no go.mod
# carries a `replace` directive before printing it. Bumping the Go modules is
# therefore a normal PR that edits those `require` lines; this workflow then cuts
# the tags on the next release.
#
# Idempotent by construction: if all six tags already exist (the steady state —
# most releases do not bump the Go module version), the job reports and exits
# 0. If only SOME exist, that is a half-published state it refuses to paper
# over — it fails loudly instead.
#
# NOT triggered by `push: branches:[main]` + a `chore(release)` message match.
# This job lived in release-tag.yml behind exactly that gate and never ran once:
# semantic-release's @semantic-release/git plugin commits
# `chore(release): X.Y.Z [skip ci]` (.releaserc.json), and GitHub's skip-ci
# recursion protection suppresses the ENTIRE workflow run on such a push — not
# merely the job's own `if:`. No run row is even created, so the dead channel
# reads as "nothing red" while five releases shipped with zero `go/**` tags.
# release.yml dispatches this explicitly instead, pinned to the fresh `vX.Y.Z`
# tag — the same proven pattern already used for publish-npm.yml and
# release-cpp.yml.
#
# Also dispatchable by hand for the one-time backfill of the releases that
# shipped before this wiring existed: `gh workflow run tag-go-modules.yml --ref main`.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-go-modules:
    name: Tag Go modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Create the go/<module>/vX.Y.Z tags
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 tools/go-module-proxy/build_local_proxy.py --print-version)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The tagging logic lives in a script so it is unit-tested on every PR
          # (tools/test/test_tag_go_modules.sh, ci.yml `proto` job). The first
          # live dispatch (run 33939440446) failed on `git tag $six_names $sha`
          # -- "fatal: too many arguments" -- because the inline block was never
          # exercised anywhere but this dispatch-only workflow.
          bash tools/go-module-proxy/tag_go_modules.sh "$version" "$GITHUB_SHA" origin
