# Third-party coverage study — Tier A (every language) and Tier B (Dart),
# issue #493.
#
# WHY THIS EXISTS: every gate the project has is scoped to code the project
# itself wrote. `check_encoder_completeness.dart` asserts that each std base
# function the encoder can emit appears in one of the hand-authored fixtures
# under tests/conformance/src, and conformance-matrix.yml runs every engine
# over that same corpus. Neither has ever seen a third-party package — which is
# how a Rust encoder converting 0/196 real files (#491), a C# encoder
# converting 0/200 (#492), a TS compiler failing 37/129 (#489) and a Dart
# compiler emitting unparseable Dart on real library files (#494) all shipped
# past 18 green required checks.
#
# WHAT THIS IS NOT: a PR gate. This workflow still has NO `pull_request:`
# trigger and is not a required check, so a regression it finds does not block
# the PR that caused it — it reddens the next scheduled (or dispatched) run
# instead.
#
# WHAT IT NOW IS: floored. The measuring jobs below each carry the positive
# floor in tools/coverage-study/summarize.sh (a run that scored zero files is a
# checkout/harness failure, never a 0% result). The `publish` job at the bottom
# adds the quality floors: it downloads all seven artifacts and runs
# tools/coverage-study/coverage_table.py, which fails the run when any row drops
# below tools/coverage-study/baseline.json, raises that baseline when a row
# improves, and regenerates the published table in README.md. The floors are
# RATCHETS at the measured numbers, not the >= 95% / >= 75% issue #493
# originally proposed: Dart Tier A measures 61% and four of the six Tier A rows
# measure 0% clean, so an aspirational floor would be red on day one and get
# muted. See the `publish` job's own header.
#
# Each harness's own self-test also runs as a gated step in its language's
# ci.yml job (Tier A's proves it does not silently skip `main`-less library
# files; Tier B's proves it scores the #488 shape as drift where Tier A calls it
# clean, and restores every substituted file byte-for-byte; the renderer's
# proves the floor is a floor).
#
# Tier A is structural and Tier B is behavioural — see the `dart-tier-b` job's
# own header for why one cannot stand in for the other.
#
# See tests/conformance/COVERAGE_STUDY.md for the methodology and the two
# load-bearing harness settings.

name: Coverage Study

on:
  workflow_dispatch:
  schedule:
    # Mondays, two hours after conformance-matrix.yml's own weekly run.
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: coverage-study-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-tier-a:
    name: Tier A (Dart)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      # The harness measures other people's code, so prove the harness first.
      - name: Harness self-test
        run: dart run tools/coverage-study/test/rq1_study_self_test.dart

      # Shallow-clone each pin at its recorded commit. A pin that cannot be
      # fetched is reported as "unreachable" by the harness and is NOT scored -
      # a network hiccup must never read as an encoder regression. Shared with
      # the five Tier A ports below (issue #493).
      - name: Clone pinned packages
        run: bash tools/coverage-study/clone_pins.sh tools/coverage-study/packages/dart.json "$RUNNER_TEMP/checkouts"

      # The positive floor (a run that scored nothing is a harness/checkout
      # failure, never a 0% result) and the step summary live in
      # tools/coverage-study/summarize.sh, shared with the five ports below.
      - name: Run Tier A
        id: tier_a
        run: |
          set -euo pipefail
          dart run tools/coverage-study/rq1_study.dart \
            --pins tools/coverage-study/packages/dart.json \
            --checkouts "$RUNNER_TEMP/checkouts" \
            --json "$RUNNER_TEMP/tier_a.json" | tee "$RUNNER_TEMP/tier_a.log"
          bash tools/coverage-study/summarize.sh Dart "$RUNNER_TEMP/tier_a.log"

      - name: Upload Tier A report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-study-tier-a-dart
          path: ${{ runner.temp }}/tier_a.json
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────
  # Tier B (Dart) — BEHAVIOURAL substitution (issue #493).
  #
  # Tier A is structural: encode → compile back → re-encode → declaration
  # inventory → IR fixpoint. By its own documented design it cannot see a
  # construct that round-trips syntactically clean but changes what the program
  # computes — #488 (`return set.add(x)` lowered to the cascade
  # `return set..add(x)`) parses, keeps every declaration and reaches the
  # fixpoint, so Tier A scored it clean across two full baselines while the
  # issue sat open.
  #
  # Tier B is the instrument that sees it: swap a library file for the
  # pipeline's own compiled-back version and run THAT PACKAGE'S OWN `dart test`.
  # Both modes run here — per-file isolation (one substitution at a time, the
  # file restored before the next) and whole-package (every eligible file at
  # once, one verdict). They answer different questions and are meant to be read
  # together.
  #
  # LIKE EVERY JOB IN THIS FILE, THIS IS NOT A GATE and never will be: the
  # workflow has no `pull_request:` trigger, so a regression Tier B finds does
  # not block the PR that caused it. The only failure here is a broken harness —
  # summarize.sh's positive floor (a run that scored zero files is a checkout
  # failure, never a 0% result). NO quality floor is set until several scheduled
  # runs establish the variance; #488's own ad-hoc prototype measured 88/106
  # files and 1/5 packages, which is a sanity check, not a committed number.
  # The harness's own self-test IS gated, on every PR, in ci.yml's Dart job.
  #
  # `--jobs 4` parallelizes across PACKAGES (independent checkouts) — never
  # across files of one package, since two substitutions would share a working
  # tree. `--test-timeout` bounds every `dart test`; a hang is reported as the
  # non-scoring `test-timeout`, never as drift.
  # ────────────────────────────────────────────────────────────────────────

  dart-tier-b:
    name: Tier B (Dart)
    runs-on: ubuntu-latest
    # Per-file substitution runs one full `dart test` per compiled-back file
    # (~106 across the five pins) plus two baseline runs per package, so this is
    # the longest job in the file by construction.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      # The harness measures other people's code, so prove the harness first.
      # This is the same self-test ci.yml's Dart job gates on every PR.
      - name: Harness self-test
        run: dart run tools/coverage-study/test/rq1_tierb_self_test.dart

      # The same five hermetic pins Tier A uses, at the same recorded commits.
      - name: Clone pinned packages
        run: bash tools/coverage-study/clone_pins.sh tools/coverage-study/packages/dart.json "$RUNNER_TEMP/checkouts"

      - name: Run Tier B (per-file isolation)
        run: |
          set -euo pipefail
          dart run tools/coverage-study/rq1_tierb.dart \
            --pins tools/coverage-study/packages/dart.json \
            --checkouts "$RUNNER_TEMP/checkouts" \
            --jobs 4 \
            --test-timeout 600 \
            --json "$RUNNER_TEMP/tier_b.json" | tee "$RUNNER_TEMP/tier_b.log"
          bash tools/coverage-study/summarize.sh Dart "$RUNNER_TEMP/tier_b.log" "Tier B"

      # A checkout left dirty by the per-file run would compound every verdict
      # of the whole-package run that follows. The harness already verifies each
      # restore by SHA-256 and throws on a mismatch; this asserts the same
      # property from OUTSIDE the harness, against git, before the second mode
      # reuses the same trees.
      #
      # `--untracked-files=no` is deliberate: substitution only ever rewrites
      # TRACKED files, while `dart pub get` leaves `.dart_tool/` and (for a
      # package whose .gitignore does not cover it) `pubspec.lock` behind. Those
      # are the harness doing its job, not a failed restore, and counting them
      # would make this assertion red for a reason that has nothing to do with
      # restoration. Every dirty checkout is printed before the step exits, so a
      # failure names the files rather than only the fact of one.
      - name: Assert every checkout was restored
        run: |
          set -euo pipefail
          dirty=0
          for dir in "$RUNNER_TEMP"/checkouts/*/; do
            status="$(git -C "$dir" status --porcelain --untracked-files=no)"
            if [ -n "$status" ]; then
              echo "::error::$dir has modified tracked files after the per-file run — Tier B did not restore it"
              printf '%s\n' "$status"
              dirty=1
            fi
          done
          if [ "$dirty" -ne 0 ]; then
            exit 1
          fi
          echo "every checkout is byte-identical to its pinned commit"

      - name: Run Tier B (whole-package)
        run: |
          set -euo pipefail
          dart run tools/coverage-study/rq1_tierb_all.dart \
            --pins tools/coverage-study/packages/dart.json \
            --checkouts "$RUNNER_TEMP/checkouts" \
            --jobs 4 \
            --test-timeout 600 \
            --json "$RUNNER_TEMP/tier_b_all.json" | tee "$RUNNER_TEMP/tier_b_all.log"
          bash tools/coverage-study/summarize.sh Dart "$RUNNER_TEMP/tier_b_all.log" "Tier B (whole-package)"

      - name: Upload Tier B reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-study-tier-b-dart
          path: |
            ${{ runner.temp }}/tier_b.json
            ${{ runner.temp }}/tier_b_all.json
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────
  # Tier A ports — Rust, C#, Go, Python (issue #493).
  #
  # Each job is INDEPENDENT: a language whose pipeline is failing every file
  # must not stop the others from reporting. Each carries the same positive
  # floor the dart-tier-a job has (in tools/coverage-study/summarize.sh): a run
  # that scored < 1 file is a harness/checkout failure, never a 0% result.
  #
  # Expect low first numbers. Unlike Dart — whose compiler emits idiomatic Dart
  # its own encoder reads back — the Rust/C#/Go/Python compilers emit
  # runtime-call-shaped source (`ball_lang_shared::runtime::*`, `BallRuntime.*`,
  # `ballrt.*`) their syntactic encoders were never built to consume. That is
  # the same wall the `*-roundtrip` rows in conformance-matrix.yml already
  # report as an honest 0/32x on the project's OWN corpus. It is also why every
  # port prints a per-stage FUNNEL next to the clean percentage: on a pipeline
  # whose round trip is not closed, WHERE files stop is the entire signal, and
  # a bare 0% would hide it.
  # ────────────────────────────────────────────────────────────────────────

  rust-tier-a:
    name: Tier A (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        working-directory: rust
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust

      # The harness measures other people's code, so prove the harness first.
      - name: Harness self-test
        run: cd rust && cargo test -p ball-rq1-study

      - name: Clone pinned packages
        run: bash tools/coverage-study/clone_pins.sh tools/coverage-study/packages/rust.json "$RUNNER_TEMP/checkouts"

      - name: Run Tier A
        run: |
          set -euo pipefail
          cd rust
          cargo run -p ball-rq1-study --bin rq1-study -- \
            --pins ../tools/coverage-study/packages/rust.json \
            --checkouts "$RUNNER_TEMP/checkouts" \
            --json "$RUNNER_TEMP/tier_a.json" | tee "$RUNNER_TEMP/tier_a.log"
          cd "$GITHUB_WORKSPACE"
          bash tools/coverage-study/summarize.sh Rust "$RUNNER_TEMP/tier_a.log"

      - name: Upload Tier A report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-study-tier-a-rust
          path: ${{ runner.temp }}/tier_a.json
          if-no-files-found: warn

  csharp-tier-a:
    name: Tier A (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('csharp/Directory.Packages.props', 'csharp/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The harness measures other people's code, so prove the harness first.
      - name: Harness self-test
        run: dotnet test csharp/coverage-study/test/Ball.CoverageStudy.Tests.csproj

      - name: Clone pinned packages
        run: bash tools/coverage-study/clone_pins.sh tools/coverage-study/packages/csharp.json "$RUNNER_TEMP/checkouts"

      - name: Run Tier A
        run: |
          set -euo pipefail
          dotnet run --project csharp/coverage-study/Ball.CoverageStudy.csproj -c Release -- \
            --pins tools/coverage-study/packages/csharp.json \
            --checkouts "$RUNNER_TEMP/checkouts" \
            --json "$RUNNER_TEMP/tier_a.json" | tee "$RUNNER_TEMP/tier_a.log"
          bash tools/coverage-study/summarize.sh "C#" "$RUNNER_TEMP/tier_a.log"

      - name: Upload Tier A report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-study-tier-a-csharp
          path: ${{ runner.temp }}/tier_a.json
          if-no-files-found: warn

  go-tier-a:
    name: Tier A (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: tools/coverage-study/go/go.sum

      # The harness measures other people's code, so prove the harness first.
      - name: Harness self-test
        run: cd tools/coverage-study/go && go test ./...

      - name: Clone pinned packages
        run: bash tools/coverage-study/clone_pins.sh tools/coverage-study/packages/go.json "$RUNNER_TEMP/checkouts"

      - name: Run Tier A
        run: |
          set -euo pipefail
          cd tools/coverage-study/go
          go run ./cmd/rq1study \
            --pins ../packages/go.json \
            --checkouts "$RUNNER_TEMP/checkouts" \
            --json "$RUNNER_TEMP/tier_a.json" | tee "$RUNNER_TEMP/tier_a.log"
          cd "$GITHUB_WORKSPACE"
          bash tools/coverage-study/summarize.sh Go "$RUNNER_TEMP/tier_a.log"

      - name: Upload Tier A report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-study-tier-a-go
          path: ${{ runner.temp }}/tier_a.json
          if-no-files-found: warn

  python-tier-a:
    name: Tier A (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      # The harness measures other people's code, so prove the harness first.
      - name: Harness self-test
        run: python3 tools/coverage-study/test/rq1_study_py_self_test.py

      - name: Clone pinned packages
        run: bash tools/coverage-study/clone_pins.sh tools/coverage-study/packages/python.json "$RUNNER_TEMP/checkouts"

      - name: Run Tier A
        run: |
          set -euo pipefail
          python3 tools/coverage-study/rq1_study_py.py \
            --pins tools/coverage-study/packages/python.json \
            --checkouts "$RUNNER_TEMP/checkouts" \
            --json "$RUNNER_TEMP/tier_a.json" | tee "$RUNNER_TEMP/tier_a.log"
          bash tools/coverage-study/summarize.sh Python "$RUNNER_TEMP/tier_a.log"

      - name: Upload Tier A report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-study-tier-a-python
          path: ${{ runner.temp }}/tier_a.json
          if-no-files-found: warn

  ts-tier-a:
    name: Tier A (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ts/compiler/package-lock.json
            ts/encoder/package-lock.json

      # The harness imports @ball-lang/encoder and @ball-lang/compiler straight
      # from source (node --experimental-strip-types), so both packages' deps
      # must be installed; it has no node_modules of its own.
      - name: Install @ball-lang/compiler deps
        run: cd ts/compiler && npm ci
      - name: Install @ball-lang/encoder deps
        run: cd ts/encoder && npm ci

      # The harness measures other people's code, so prove the harness first.
      - name: Harness self-test
        run: node --experimental-strip-types tools/coverage-study/test/rq1_study_ts_self_test.mts

      - name: Clone pinned packages
        run: bash tools/coverage-study/clone_pins.sh tools/coverage-study/packages/ts.json "$RUNNER_TEMP/checkouts"

      - name: Run Tier A
        run: |
          set -euo pipefail
          node --experimental-strip-types tools/coverage-study/rq1_study_ts.mts \
            --pins tools/coverage-study/packages/ts.json \
            --checkouts "$RUNNER_TEMP/checkouts" \
            --json "$RUNNER_TEMP/tier_a.json" | tee "$RUNNER_TEMP/tier_a.log"
          bash tools/coverage-study/summarize.sh TypeScript "$RUNNER_TEMP/tier_a.log"

      - name: Upload Tier A report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-study-tier-a-typescript
          path: ${{ runner.temp }}/tier_a.json
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────
  # Publish + floor (issue #493, the slice that closes it).
  #
  # THE GAP THIS CLOSES: the seven jobs above have produced honest numbers since
  # slice 1, and nothing consumed them. Each uploaded a JSON artifact and
  # exited, so a real third-party regression — the Rust encoder going from 110
  # scored files to 40, the Dart round trip falling from 65/106 to 50/106 — was
  # visible only to a human who downloaded seven artifacts and diffed them by
  # hand against a number written in a GitHub comment. The numbers were also
  # published nowhere a reader of the repository would find them.
  #
  # RATCHET, NOT THE ISSUE'S 95%/75%. Issue #493 proposed "Dart Tier A >= 95%,
  # Tier B >= 75%". Measured, Dart Tier A is 61% and four of the six Tier A rows
  # are at 0% clean (those compilers emit runtime-call-shaped source their
  # syntactic encoders were never built to read back — the same wall the
  # `*-roundtrip` rows in conformance-matrix.yml report on the project's OWN
  # corpus). A 95% floor would be red on its first run and stay red, and this
  # project's rule for a known-incomplete leg is to RATCHET it: fail only on a
  # DROP below a checked-in baseline, raise the baseline on an improvement,
  # never parity-gate it and never skip it.
  #
  # `if: always()` is deliberate and load-bearing. With a bare `needs:`, a
  # failed measuring job would SKIP this one, and a skipped check reads as green
  # — the exact way an absent gate has hidden a regression here before. Running
  # anyway turns a broken upstream job into a loud red: coverage_table.py fails
  # on a missing artifact rather than treating it as 0 scored, 0 clean (which
  # would satisfy every percentage floor forever).
  #
  # The commit is guarded twice over: this workflow has no `pull_request:`
  # trigger at all, and the commit step additionally requires `github.ref` to be
  # refs/heads/main, so a dispatch on a topic branch runs the full check-and-
  # render end-to-end and commits nothing.
  # ────────────────────────────────────────────────────────────────────────

  publish:
    name: Publish coverage table
    needs:
      - dart-tier-a
      - dart-tier-b
      - rust-tier-a
      - csharp-tier-a
      - go-tier-a
      - python-tier-a
      - ts-tier-a
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Overrides the workflow-level `contents: read`; this is the only job in
      # the file that writes anything back to the repository.
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      # The renderer decides whether a run passes, so prove it first — the same
      # rule every measuring job above follows. This is the identical step
      # ci.yml's python job gates on every PR.
      - name: Renderer/floor self-test
        run: python3 tools/coverage-study/test/coverage_table_self_test.py

      # `merge-multiple` is left at its default false, so each artifact lands in
      # its own directory named after it — the same layout `gh run download`
      # produces, and the layout the `artifact` path in every baseline row
      # names (e.g. coverage-study-tier-a-dart/tier_a.json).
      - name: Download every coverage-study report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-study-*
          path: ${{ runner.temp }}/reports

      # Fails the run on a drop in any row's clean ratio, stage-1 funnel ratio,
      # or scored denominator; raises the baseline on an improvement; rewrites
      # the generated block in README.md. A missing or zero-scored report is a
      # hard failure here, never a 0% pass.
      - name: Check the floors and regenerate the table
        run: |
          set -euo pipefail
          python3 tools/coverage-study/coverage_table.py \
            --artifacts "$RUNNER_TEMP/reports" \
            --baseline tools/coverage-study/baseline.json \
            --readme README.md \
            --write \
            --summary "$GITHUB_STEP_SUMMARY"

      # Only on main, and only when the regeneration actually changed something
      # — the renderer is a pure function of the reports and carries no
      # timestamp, so a week that moved no number produces no commit at all.
      #
      # `[skip ci]` matches the marker release.yml's own bot commits use, so
      # this push does not start a second CI run.
      - name: Commit the regenerated table and raised baseline
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md tools/coverage-study/baseline.json; then
            echo "table and baseline already current — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tools/coverage-study/baseline.json
          git commit \
            -m "chore(coverage-study): refresh the third-party coverage table [skip ci]" \
            -m "Regenerated from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} by tools/coverage-study/coverage_table.py. A raised row means that measure improved and its floor moved up with it (issue #493)."
          git push origin HEAD:refs/heads/main

      # Off main the commit step above is skipped by design, which would
      # otherwise leave a dispatch on a topic branch looking like it did
      # nothing. Say so, and show the diff the run would have committed.
      - name: Report what a main run would have committed
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "ref is ${GITHUB_REF} — not main, so nothing is committed."
          git --no-pager diff --stat -- README.md tools/coverage-study/baseline.json
          git --no-pager diff -- tools/coverage-study/baseline.json
