name: Tag Go modules

# ──────────────────────────────────────────────────
# Go modules — the six `go/<module>/vX.Y.Z` tags (issues #361, #623)
# ──────────────────────────────────────────────────
# The Go module proxy serves each nested module as its own tree, keyed by a
# `go/<module>/vX.Y.Z` tag, and every intra-repo `require` in go/*/go.mod names
# that exact version. So all six tags must land on ONE commit, together, or a
# dependent resolves to a version that does not exist.
#
# WHO DISPATCHES THIS, AND WHEN. Exactly one thing does:
# `.github/release/go.releaserc.json`'s **publishCmd**, at the end of a
# `go-release.yml` semantic-release run, pinned to that run's own
# `go-modules/vX.Y.Z` channel tag. Since #623 the Go module version is its own
# semantic-release line computed from `go/`-path commits: the same config's
# prepareCmd runs `tools/go-module-proxy/bump_go_modules.sh`, @semantic-release/git
# pushes the bump as `chore(release): go vX.Y.Z [skip ci]`, semantic-release
# creates the channel tag ON that commit (it tags after prepare and before
# publish), and publishCmd then dispatches this workflow at it. That is why the
# ref carries the bumped go.mod files and why the version below is simply read
# back out of them.
#
# `release.yml` does NOT dispatch this workflow. It used to, version-lessly, on
# every release — which re-ran the tagger at whatever number the go.mod files
# already carried and reported success for doing nothing. #623 removed it, and
# `tools/release/check_go_release_wiring.sh` now FAILS if it ever comes back, if
# a second dispatcher appears, or if this header starts claiming otherwise
# (#627).
#
# The dispatch is AWAITED (#627). `gh workflow run` returns the moment GitHub
# accepts the request, so publishCmd goes through
# `tools/release/await_workflow_run.py`, which polls this run to completion on a
# bounded budget and fails the release step on any non-success conclusion. A tag
# cut that fails, is cancelled, or never starts now reddens the release run that
# caused it instead of leaving it green.
#
# The version is NOT the Dart/Melos release version: the Go modules carry their
# own line (v0.1.0 first, v0.2.0 since #586), single-sourced from the go.mod
# files themselves — build_local_proxy.py --print-version asserts all six agree,
# that no go.mod carries a `replace` directive, that go.work's pins and `use`
# block agree with them, and (in smoke.sh) that the synthesized proxy carries
# exactly this version before printing it.
#
# Tags are IMMUTABLE once fetched through proxy.golang.org / sum.golang.org — a
# moved tag is a checksum mismatch for every consumer that already has it — which
# is why the half-tagged refusal below never papers over a partial set, and why a
# published line is superseded by a NEW version rather than re-cut in place.
#
# Idempotent by construction: if all six tags already exist (which is what a
# re-dispatch of an already-tagged channel tag hits), the job reports and exits
# 0. If only SOME exist, that is a half-published state it refuses to paper over
# — it fails loudly instead.
#
# NOT triggered by `push: branches:[main]` + a `chore(release)` message match.
# This job lived in release-tag.yml behind exactly that gate and never ran once:
# semantic-release's @semantic-release/git plugin commits
# `chore(release): X.Y.Z [skip ci]`, and GitHub's skip-ci recursion protection
# suppresses the ENTIRE workflow run on such a push — not merely the job's own
# `if:`. No run row is even created, so the dead channel reads as "nothing red"
# while five releases shipped with zero `go/**` tags. workflow_dispatch is the
# documented exception to that suppression, which is why this lane uses it.
#
# Whether the tags this cuts are actually SERVED is a separate question, and a
# separate alarm: `.github/workflows/go-freshness.yml` (weekly) asks
# proxy.golang.org whether it lists the version main's go.mod files name.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-go-modules:
    name: Tag Go modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Create the go/<module>/vX.Y.Z tags
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 tools/go-module-proxy/build_local_proxy.py --print-version)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The tagging logic lives in a script so it is unit-tested on every PR
          # (tools/test/test_tag_go_modules.sh, ci.yml `proto` job). The first
          # live dispatch (run 33939440446) failed on `git tag $six_names $sha`
          # -- "fatal: too many arguments" -- because the inline block was never
          # exercised anywhere but this dispatch-only workflow.
          bash tools/go-module-proxy/tag_go_modules.sh "$version" "$GITHUB_SHA" origin
