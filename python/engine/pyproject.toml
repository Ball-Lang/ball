[project]
name = "ball-engine"
version = "0.1.0"
description = "Self-hosted Python Ball engine (epic #445 Phase 4)"
requires-python = ">=3.11"
# The zero-dependency ballrt runtime and the ball_compiler are consumed from the
# sibling python/ packages (on PYTHONPATH); the loader uses the generated
# protobuf bindings to materialise proto3 defaults in the program view.
dependencies = ["protobuf>=5.29"]

[tool.pytest.ini_options]
# `conformance/` is a whole-corpus sweep driven by `python -m conformance.runner`
# (it holds no test_*.py, so pytest collected nothing here before); `tests/` is
# the unit suite — the compile-on-first-use bootstrap the ball-lang wheel depends
# on (issue #496).
testpaths = ["tests"]
