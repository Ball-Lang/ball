name: Release Dart packages (pub.dev)

# ─────────────────────────────────────────────────────────────────────────────
# The pub.dev lane, fully automated (#551).
#
# WHAT THIS REPLACED: `release-prepare.yml` ran Melos on every push to main and
# refreshed one rolling `chore/release` PR; a maintainer squash-merged it; only
# then did `release-tag.yml` tag each package and dispatch `release-publish.yml`.
# Every automated link in that chain worked and stayed green — and the lane
# still shipped nothing between 2026-07-06 and 2026-09-05, because the rolling
# PR (#272) was never merged. It was the only one of this repo's seven release
# channels with a human in the critical path, and a human step that stops
# happening is invisible: the automation around it keeps reporting success.
#
# THE MODEL NOW: one `semantic-release` config per publishable Dart package
# (`.github/release/<pkg>.releaserc.json`), each with its own `<pkg>-vX.Y.Z` tag
# line and a path-scoped commit filter, run here once per package. No rolling
# PR, no `melos version`, no human step. This is the Dart slice of the
# per-package model documented under "Release v2" in docs/RELEASE.md — landed
# narrowly for pub.dev because pub.dev is the lane that was broken; npm, Go,
# C++, crates.io, PyPI and NuGet are untouched and keep their current flows.
#
# WHY workflow_dispatch AND NOT `push: branches: [main]`:
#   `release.yml` is already push-triggered and its semantic-release step pushes
#   `chore(release): X.Y.Z [skip ci]` to main. If this workflow also fired on
#   that same push, two jobs would race commits onto main and lose to
#   non-fast-forward rejections. Instead `release.yml` dispatches this workflow
#   explicitly, AFTER its own push has landed, guarded on a release actually
#   having been cut — the identical pattern it already uses for
#   publish-npm.yml, release-cpp.yml and tag-go-modules.yml, and the pattern
#   `tools/release/check_pubdev_release_wiring.sh` pins.
#
#   That dispatch uses `--ref main`, NOT the `vX.Y.Z` tag the sibling channels
#   use. Those channels build a released tree, so pinning them to the tag is
#   right. This one RUNS semantic-release, whose @semantic-release/git step
#   pushes commits and tags to a BRANCH; a detached tag ref gives it no branch
#   to release from.
#
# SEQUENTIAL, NEVER A MATRIX: each package's @semantic-release/git step pushes
# its own commit to main, and concurrent pushes race into non-fast-forward
# rejections. A successful push leaves the runner's local branch in sync with
# origin, so the next package starts fast-forward-clean.
#
# RECURSION PROTECTION IS PRESERVED: the `<pkg>-vX.Y.Z` tag semantic-release
# pushes is created with GITHUB_TOKEN, so `release-publish.yml`'s
# `push: tags:` trigger does NOT fire for it. Each config's
# @semantic-release/exec `publishCmd` therefore dispatches the publish backend
# explicitly with `gh workflow run release-publish.yml --ref <pkg>-v<version>`.
# That workflow_dispatch-with-a-tag-ref shape is what the retired
# `release-tag.yml` used, and pub.dev accepted it for every real publish (e.g.
# runs 28782924129-28782934612 on 2026-07-06 published ball_cli/ball_compiler/
# ball_engine 0.3.0+6): the OIDC token's `ref` claim is the tag, which is what
# pub.dev matches against each package's configured `<pkg>-v{{version}}` tag
# pattern.
#
# ORDERING IS LOAD-BEARING, AND IT IS GATED. Each package's prepareCmd runs
# `tools/release/sync_pubspec_deps.mjs`, which re-pins every workspace member's
# constraints on its siblings to the versions currently in the tree, and each
# release commits all ten pubspecs. So a package that releases BEFORE one of its
# dependencies publishes a tarball still pinned to that dependency's old
# version — resolvable, green, and semantically wrong. The list below is
# therefore a genuine topological order, deps first.
#
# It can be one because the cycles in this workspace
# (ball_base↔ball_protobuf, ball_engine↔ball_encoder, ball_protobuf_gen→ball_rpc)
# are ALL dev-dependency edges, and pub never resolves a dependency's
# dev_dependencies for a consumer — the RUNTIME `dependencies:` graph is acyclic.
# A dev-only edge can leave one tarball's dev pin a release behind; that is
# invisible to consumers and self-corrects on the package's next release.
#
# `tools/release/check_pubspec_workspace_consistency.mjs` (ci.yml, every PR)
# recomputes the runtime graph from the pubspecs and fails if this list is not a
# valid deps-first order of it, or if it does not name exactly the publishable
# packages. Do not reorder it by hand without re-running that guard.
#
# LOCKSTEP (#566). Ordering alone is not enough. Each release's prepareCmd
# sweeps EVERY workspace member's sibling pins, and @semantic-release/git
# commits them — including the pins of packages that have no releasable commits
# of their own. Those packages are never published, so pub.dev keeps serving
# their OLD pubspec, and the published graph splits:
#
#   ball_base     0.4.0    published
#   ball_resolver 0.3.0+3  NOT released, still pinning ball_base ^0.3.0+3
#   -> Because ball_resolver >=0.3.0+3 depends on ball_base ^0.3.0+3 and
#      ball_engine >=0.4.0 depends on ball_base ^0.4.0, version solving failed.
#
# That is exactly what the first live run (33953248977) shipped. Every
# pre-publish gate the lane had validates the REPO workspace, where a
# re-pinned-but-unreleased package looks perfectly healthy.
#
# So the loop below asks `tools/release/lockstep_plan.mjs --decide` before each
# package: if that package's PUBLISHED pubspec pins a sibling at a version this
# run will move out from under it, the planner returns `patch` and the loop
# passes it through as SR_FORCE_RELEASE, which
# `tools/release/only-package-commits.mjs` promotes into a release. The rule is
# deliberately narrow — a pin merely rewritten, but still satisfiable, does NOT
# force a release — because the broad version ("any chore(release) commit
# touching my paths is a patch trigger") is self-sustaining and would republish
# all nine packages on every run forever. Because the order is deps-first, one
# forward pass is a fixpoint.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only — compute the next version per package, create no tags, commits, releases or publishes. Use this to rehearse."
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  # gh workflow run (each publishCmd dispatches release-publish.yml)
  actions: write

# One Dart release run at a time — sequential per-package pushes to main must
# never overlap with another run of this workflow.
concurrency:
  group: pubdev-release
  cancel-in-progress: false

jobs:
  release:
    name: Per-package semantic-release (pub.dev)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # A REAL release always runs from the tip of main, never from whatever
          # ref the dispatch happened to name.
          #
          # A DRY RUN checks out the dispatched ref instead, and it must: a
          # rehearsal that always runs main's tree cannot rehearse a change to
          # the release lane itself, which is why #566 shipped unrehearsed — the
          # only way to exercise it was to merge it. A dry run creates no
          # commits, tags, releases or publishes (semantic-release skips
          # prepare, publish, addChannel, success and fail), so there is nothing
          # for the branch choice to damage.
          ref: ${{ inputs.dry_run && github.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      # ball_cli's prepareCmd regenerates dart/cli/lib/src/version.g.dart, the
      # single source of the `ball` CLI version (#363). ci.yml runs
      # `gen_version.dart --check` on every PR, so a release that bumps
      # dart/cli/pubspec.yaml without regenerating that file leaves main red for
      # the next contributor. This is the Dart toolchain the "Release v2"
      # scaffolding deliberately deferred (docs/RELEASE.md cutover item 3).
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      # Resolves the whole pub workspace from the repo root (retry-wrapped, so a
      # transient pub.dev resolver hiccup cannot fail a release — #520).
      - name: Resolve the Dart workspace
        uses: ./.github/actions/dart-pub-get

      # Pinned toolchain (tools/release/package-lock.json). The local path-filter
      # plugin (tools/release/only-package-commits.mjs) resolves its
      # @semantic-release/commit-analyzer + release-notes-generator imports from
      # this node_modules, so it MUST be installed here (not `-g`).
      - name: Install release toolchain
        run: cd tools/release && npm ci

      # The lockstep baseline: what pub.dev serves RIGHT NOW, before this run
      # touches anything. Every "does this package have to release too?"
      # decision below is measured against this snapshot plus the versions this
      # run has already decided — never against the repo tree, which the sweep
      # keeps consistent whether or not the packages in it were published.
      - name: Snapshot the live pub.dev graph (lockstep baseline, #566)
        env:
          SR_LOCKSTEP_PUBLISHED: ${{ runner.temp }}/pubdev-published.json
        run: node tools/release/lockstep_plan.mjs --fetch-published

      - name: Run semantic-release per package (sequential)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Read by lockstep_plan.mjs --decide (this step) and --record (each
          # config's verifyReleaseCmd, which semantic-release runs in --dry-run
          # mode too — so a rehearsal produces the same plan as a real run).
          SR_LOCKSTEP_PUBLISHED: ${{ runner.temp }}/pubdev-published.json
          SR_LOCKSTEP_STATE: ${{ runner.temp }}/pubdev-lockstep-state.json
        run: |
          set -euo pipefail
          FLAG=""
          if [ "${DRY_RUN}" = "true" ]; then
            # `branches: ["main"]` in every config, and semantic-release reads
            # the CURRENT branch from the CI environment (GITHUB_REF), not from
            # git — so on a rehearsal branch it would stop at "configured to
            # only publish from main" and compute nothing. --branches makes the
            # dispatched branch a release branch FOR THE REHEARSAL ONLY. A real
            # run never gets this flag, and a dry run publishes nothing whatever
            # branch it is on.
            FLAG="--dry-run --branches ${GITHUB_REF_NAME}"
          fi
          SR="tools/release/node_modules/semantic-release/bin/semantic-release.js"
          echo '{}' > "$SR_LOCKSTEP_STATE"

          # A topological order of the runtime dependency graph, deps first.
          # Gated by tools/release/check_pubspec_workspace_consistency.mjs — see
          # the ORDERING note above before touching it.
          PACKAGES="
            ball_protobuf
            ball_base
            ball_resolver
            ball_encoder
            ball_engine
            ball_compiler
            ball_rpc
            ball_protobuf_gen
            ball_cli
          "

          for cfg in $PACKAGES; do
            echo "::group::semantic-release $cfg"
            # Stage this package's config as THE config semantic-release
            # discovers. The root .releaserc.json (the npm lockstep lane, still
            # live) would otherwise be auto-discovered by cosmiconfig and merged
            # OVER the per-package config, and its branches/plugins/tagFormat
            # would win. The copy is in no @semantic-release/git `assets` list,
            # so it is never committed.
            cp ".github/release/${cfg}.releaserc.json" ".releaserc.json"

            # Lockstep (#566): `patch` when this package's PUBLISHED pubspec
            # pins a sibling at a version this run moves out from under it,
            # empty otherwise. The reason is printed on stderr either way, so
            # the run log always says why a package did or did not release.
            FORCE="$(node tools/release/lockstep_plan.mjs --decide --package="$cfg")"

            SR_FORCE_RELEASE="$FORCE" node "$SR" $FLAG
            echo "::endgroup::"
          done

          echo "::group::lockstep plan for this run"
          cat "$SR_LOCKSTEP_STATE"
          echo "::endgroup::"

      # ── The release loop just rewrote every pubspec in the workspace: each
      #    package's own `version:`, and every sibling's constraint on it. Those
      #    ten files are ONE pub resolution unit, so a single member left behind
      #    makes `dart pub get` fail for the whole repo — for the next
      #    contributor and for CI on main — and `melos bootstrap` inside
      #    release-publish.yml would fail on it too. Prove it here, in the run
      #    that caused it, instead of discovering it on somebody else's PR.
      #
      #    Reached even when the loop failed part-way, so a partial release
      #    still reports the workspace's true state. A failure here means the
      #    fix is a follow-up commit re-running the sweep, not a rollback.
      - name: Verify the workspace still resolves after the release
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          set -euo pipefail
          node tools/release/check_pubspec_workspace_consistency.mjs
          dart pub get
