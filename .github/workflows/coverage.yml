name: Coverage

# Cross-stack coverage: each language stack runs its suites under coverage,
# emits lcov, and publishes it as a `coverage-lcov-<flag>` artifact; the
# separate `codecov-upload` job carries those to Codecov under their flags
# (dart / typescript / cpp / rust / csharp), which Codecov merges into one
# repo-wide report (epic #59, #60). Auth is OIDC — public repo, no
# CODECOV_TOKEN needed.
#
# MEASUREMENT AND TRANSPORT ARE DIFFERENT JOBS (issue #638). A language job's
# conclusion is its COVERAGE FLOOR's verdict and nothing else: it ends on its
# floor steps, having already handed its lcov over. Uploading lived inside those
# jobs until run 34746079045, whose `C++ coverage` job passed both floors and
# then died on a codecov-action OIDC token-fetch timeout — a red on main with no
# coverage regression behind it, on the very history #63's ratchet and #599's
# cache ceiling read. See the `codecov-upload` job below for why
# `fail_ci_if_error: false` could not prevent that and why the retry is ours;
# tools/ci/check_coverage_upload_isolation.sh (ci.yml's always-on `Proto Checks`
# job) is what keeps the two halves apart.
#
# The Dart job ALSO enforces the line-coverage ratchet (floor must never
# regress; raise toward 100%).
#
# WHY THIS DART JOB STILL EXISTS NOW THAT THE RATCHET IS A PR GATE (#605).
# ci.yml's always-on `Dart Coverage Ratchet` job runs the identical
# `tools/coverage_dart.dart --floor 99.9` on every pull request, and THAT is
# what blocks a merge. This job is not a duplicate of it: it owns the **Codecov
# upload** (OIDC, `flags: dart`) that feeds the cross-stack report — the reason
# the whole workflow exists — and it is the push-to-main measurement the C++
# floor derivation and the published numbers read. Keeping the ratchet step here
# too is deliberate: it costs nothing (the lcov has to be produced for the
# upload anyway) and it keeps main's own number honest if the PR gate is ever
# bypassed. The two call sites must stay on the SAME floor; the exclusions are
# not duplicated at all — `--exclude-tags slow,network` lives inside
# coverage_dart.dart, so they cannot drift.
#
# TRIGGERS. Everything runs on push to main + on demand, as before. The C++ job
# ALONE additionally runs on cpp-touching pull requests (issue #63): until now
# the only job in the repo that computes C++ line coverage and fails below a
# floor was never scheduled for a `pull_request` event at all, so a PR that
# dropped C++ coverage — a wholly uncovered new code path included — sailed
# through every required check and was caught, if at all, only by the NEXT
# push-to-main run, after the merge. Codecov's own PR status cannot block
# either: codecov.yml declares project+patch `informational: true` for all
# flags. The path filter is deliberately tight (this job is 10-50 min) and the
# other four jobs are pinned to non-PR events below, so a cpp-only PR pays for
# the C++ job and nothing else. This is NOT one of the required checks and does
# not gate a merge; it makes a C++ coverage regression VISIBLE before the merge
# for the first time. Promoting it to required is a separate, later decision.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "cpp/**"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

# Codecov OIDC (tokenless) upload needs id-token: write.
permissions:
  contents: read
  id-token: write

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────
  # Dart — per-package lcov + line-coverage ratchet
  # ──────────────────────────────────────────────────
  dart:
    name: Dart coverage
    # The pull_request trigger is scoped to cpp/** for the C++ job's sake
    # (issue #63); this job stays push/dispatch-only so a cpp-only PR does
    # not drag the whole cross-stack coverage matrix into it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      # The compiler tests shell out to @ball-lang/compiler (TsCompiler wrapper),
      # so Node + the built TS compiler are required — mirror the ci.yml dart job.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/compiler/package-lock.json

      - name: Install dependencies
        run: cd dart && dart pub get

      - name: Install & build @ball-lang/compiler
        run: cd ts/compiler && npm ci && npm run build

      # Some package suites read the generated shared artifacts (e.g.
      # ball_protobuf's facade test reads ball_protobuf.json). Regenerate them
      # first — mirrors ci.yml's ball-freshness setup — so coverage runs against
      # a correctly-built workspace.
      - name: Regenerate shared Ball artifacts
        run: |
          ( cd dart/shared  && dart run bin/gen_std.dart . )
          ( cd dart/shared  && dart run bin/gen_ball_proto.dart . )
          ( cd dart/encoder && dart run bin/gen_ball_protobuf.dart ../shared )

      # Measures EVERY workspace package and EVERY authored file (untested files
      # count as 0%, never dropped) and fails if overall line coverage drops
      # below the floor. RAISE the floor toward 100% as tests are added (see
      # docs/TESTING_STRATEGY.md); never lower it without justification.
      # Honest PRODUCT coverage: 99.99% local / 100.00% on CI (all 9
      # packages' lib/; bin/ entry-point tooling excluded — see
      # coverage_dart.dart). Per-package (#61 close-out wave): ball_protobuf
      # 100%, ball_protobuf_gen 100%, ball_rpc 100%, compiler 100%,
      # encoder 100%, engine 100%, resolver 100%, shared 100%, cli 99.80%
      # local / 100% CI. Every excluded line carries a per-site
      # `// coverage:ignore` justification in-source (three categories:
      # environmental I/O — network/raw-stdout/external-runner harness;
      # verified-unreachable defensive arms, proven per-arm via caller
      # analysis; and `bin/` entry-point glue excluded wholesale). The one
      # local-only gap (cli runner.dart 'Error reading file') is covered on
      # CI by a POSIX chmod test that must skip on Windows — the variance
      # direction is CI ≥ local by construction.
      # Dedicated suites drove the workspace from ~64% → 100%.
      # Identical invocation to ci.yml's `Dart Coverage Ratchet` job (#605),
      # which is the PR gate. Keep the two floors in lockstep.
      - name: Dart line coverage ratchet (all packages)
        # Ratcheted 99 -> 99.9 after the #61 close-out wave (engine
        # 99.17% -> 100% via engine_wave8_coverage_test.dart's
        # BallModuleHandler-driven dispatch-arm tests; compiler 99.97% ->
        # 100% via the plain-class const-field test; ball_protobuf_gen
        # 99.01% -> 100% via dart_emitter_wave7_coverage_test.dart;
        # cli 92.31% -> 100%-of-reachable via 4 new runner tests + per-site
        # network/stdout exclusions). Floor kept a margin below the local
        # 99.99% so an unrelated platform skip can't flap the gate; CI
        # measures 100.00%.
        run: dart run tools/coverage_dart.dart --floor 99.9

      # THE ONLY STEP ALLOWED TO FOLLOW A FLOOR STEP (#638). Every other stack
      # hands its lcov over BEFORE its gate; coverage_dart.dart writes
      # coverage/dart.lcov and enforces the floor in the SAME invocation (the
      # file is written before the comparison), so re-running it just to take the
      # artifact would double a 20-minute job. Hence `!cancelled()`: the artifact
      # must be taken even when the ratchet FAILS, or Codecov's history would get
      # a hole exactly at the commit that dropped — the one run worth publishing.
      # The step cannot HIDE the ratchet's verdict: a failed step is not rescued
      # by a later one running, so a ratchet failure still reds this job, and
      # tools/ci/check_coverage_upload_isolation.sh is what keeps it that way.
      #
      # RESIDUAL, in the OTHER direction (#700 item 2): this job's conclusion is
      # a LOWER BOUND on the ratchet, not the ratchet itself. `if-no-files-found:
      # error` below is deliberate — an empty artifact would make the upload job
      # green while publishing nothing — but it also means an artifact-upload
      # flake reds `dart` with no coverage regression whatsoever: the same
      # "transport reddened a green measurement" class #638 is about, arriving
      # through the other half of the job. An earlier wording here said this
      # job's conclusion "is still the floor's", which is false in exactly that
      # direction. So read the `Dart line coverage ratchet (all packages)` STEP
      # and the number it printed, never this job's conclusion — the rule
      # cpp/build-cov-floor.sh's header states for the C++ job, true here for the
      # same reason.
      - name: Publish the Dart lcov for the upload job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Single merged lcov with the COMPLETE file/folder tree (every package,
          # every authored file, 0% for untested) — not a tested subset.
          name: coverage-lcov-dart
          path: coverage/dart.lcov
          # An empty artifact would make the upload job green while publishing
          # nothing — the silent half of the failure #638 is about.
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────
  # TypeScript — c8 (V8) coverage → lcov, per package
  # ──────────────────────────────────────────────────
  typescript:
    name: TypeScript coverage
    # The pull_request trigger is scoped to cpp/** for the C++ job's sake
    # (issue #63); this job stays push/dispatch-only so a cpp-only PR does
    # not drag the whole cross-stack coverage matrix into it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      # ts/compiler's engine-parse test regenerates engine.ball.json from the
      # Dart self-host source, so the Dart workspace must be resolved.
      - name: Bootstrap Dart workspace
        run: cd dart && dart pub get

      # Runs the SAME `npm test` ts/engine's own package.json defines
      # (engine_test.ts's 355-fixture conformance run through the compiled
      # engine, THEN the dedicated unit suites), under ONE c8 invocation so
      # both halves land in a single merged lcov.info — a prior version of
      # this step ran engine_test.ts only (as its own `node` invocation,
      # bypassing npm test), silently omitting ball_file.test.ts/
      # engine_setup.test.ts/index_wrapper.test.ts and understating coverage
      # by ~18 points (81.65% measured vs 99.85% real; #62 Phase-1 gap-map).
      - name: Coverage — @ball-lang/engine
        run: |
          cd ts/engine && npm ci && npm run build
          npx --yes c8@11.0.0 --reporter=lcovonly --src src --all npm test

      # Two invocations merged into one lcov.info (the second's --clean=false
      # keeps the first's V8 coverage instead of overwriting it): the fast
      # unit-test loop, THEN full_e2e.ts's 317-fixture conformance harness.
      # full_e2e.ts is deliberately excluded from `npm test`'s test/*.test.ts
      # glob (see its own docstring) so the fast dev loop stays fast, but
      # skipping it here as well understated coverage for any code path only
      # a conformance fixture exercises (#62 Phase-2c; e.g. emitLabelStmt/
      # emitGotoStmt, exercised only by the goto/label conformance fixture).
      - name: Coverage — @ball-lang/compiler
        run: |
          cd ts/compiler && npm ci && npm run build
          npx --yes c8@11.0.0 --reporter=lcovonly --src src --all \
            node --experimental-strip-types --test test/*.test.ts
          npx --yes c8@11.0.0 --clean=false --reporter=lcovonly --src src --all \
            node --experimental-strip-types test/full_e2e.ts

      - name: Coverage — @ball-lang/encoder
        run: |
          cd ts/encoder && npm ci && npm run build
          npx --yes c8@11.0.0 --reporter=lcovonly --src src --all \
            node --experimental-strip-types --test test/*.test.ts

      - name: Coverage — @ball-lang/shared
        run: |
          cd ts/shared && npm ci
          npx --yes c8@11.0.0 --reporter=lcovonly --src src --all \
            node --experimental-strip-types --test test/*.test.ts

      # cli depends on the in-repo engine via `file:../engine` — since the
      # @ball-lang/engine step above already ran `npm ci && npm run build`
      # in the same job/checkout, `npm ci` here resolves and links it fine
      # (this is the same order ci.yml uses). test/cli_test.ts spawns the
      # built CLI via spawnSync, which inherits NODE_V8_COVERAGE from the c8
      # parent process, so the black-box subprocess suite's coverage is
      # captured too — not just the dependency-free capability_* unit tests.
      - name: Coverage — @ball-lang/cli
        run: |
          cd ts/cli && npm ci && npm run build
          npx --yes c8@11.0.0 --reporter=lcovonly --src src --all npm test

      # ALL five TS packages (engine, compiler, encoder, shared, cli). c8
      # `--all` includes never-executed src files at 0%, so each package's
      # coverage is complete, not just the exercised files. Staged into one flat
      # directory with distinct names so the artifact's layout does not depend on
      # upload-artifact's least-common-ancestor rule for a multi-path upload.
      - name: Stage the TypeScript lcov files
        run: |
          set -euo pipefail
          mkdir -p ts-coverage
          for pkg in engine compiler encoder shared cli; do
            cp "ts/$pkg/coverage/lcov.info" "ts-coverage/$pkg.lcov"
          done
          ls -l ts-coverage

      - name: Publish the TypeScript lcov for the upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov-typescript
          path: ts-coverage/
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────────
  # C++ — gcov/lcov over the ctest binaries (Linux/gcc)
  # ──────────────────────────────────────────────────
  cpp:
    name: C++ coverage
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1
        with:
          setup_only: true

      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: cpp-coverage
          max-size: 1G

      - name: Install nlohmann-json + lcov
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev lcov

      # Debug + --coverage (gcov) instrumentation. A separate build dir from the
      # release build so the regular ci.yml cache is untouched.
      - name: Configure CMake (coverage)
        run: >
          cmake -S cpp -B cpp/build-cov
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="--coverage -O0 -g"
          -DCMAKE_CXX_FLAGS="--coverage -O0 -g"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build cpp/build-cov -j 2

      # Baseline (--initial) BEFORE running tests: records 0-coverage for every
      # instrumented source, so a file that's compiled but never exercised shows
      # 0% instead of vanishing from the report.
      - name: Capture baseline coverage (lcov --initial)
        run: |
          lcov --capture --initial --directory cpp/build-cov --output-file cpp.base.lcov \
            --ignore-errors mismatch,gcov,source,negative,empty,unused,format

      - name: Run tests
        run: ctest --test-dir cpp/build-cov --output-on-failure

      # Capture test coverage, merge with the baseline (so unexecuted files stay
      # at 0%), then drop system headers, FetchContent deps, build artifacts,
      # generated code and tests. lcov 2.x is strict — tolerate the usual gcov
      # noise. cpp/shared/ball_protobuf_rt.h is GENERATED ("Generated by ball
      # compiler (C++ target, library mode)" — the compiled ball_protobuf Ball
      # module), same class as engine_rt.cpp / gen/ / compiled_engine.ts: it
      # entered the instrumented set with #18 Stage 5 (ball_rt_decode.cpp now
      # always compiles it) and its ~3.7k machine-emitted lines at ~16% dragged
      # the overall number from ~74% to ~46% overnight, tripping the floor below
      # on the flip commit itself — generated output is excluded from the
      # hand-written measurement, here and in codecov.yml's ignore list.
      - name: Capture + merge coverage (lcov)
        run: |
          lcov --capture --directory cpp/build-cov --output-file cpp.test.lcov \
            --ignore-errors mismatch,gcov,source,negative,empty,unused,format
          lcov --add-tracefile cpp.base.lcov --add-tracefile cpp.test.lcov \
            --output-file cpp.lcov --ignore-errors unused,empty,corrupt
          lcov --remove cpp.lcov \
            '/usr/*' '*/_deps/*' '*/build-cov/*' '*/gen/*' '*/test/*' \
            '*/cpp/shared/ball_protobuf_rt.h' \
            '*/cpp/shared/ball_program_descriptor.h' \
            --output-file cpp.lcov --ignore-errors unused,empty
          lcov --list cpp.lcov --ignore-errors empty

      # Hand the measurement to the transport job BEFORE the gates below, so
      # everything that follows in this job is a floor step and this job's
      # conclusion is exactly the floor verdict (#638).
      - name: Publish the C++ lcov for the upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov-cpp
          path: cpp.lcov
          if-no-files-found: error
          retention-days: 7

      # Line-coverage ratchet for cpp/{compiler,encoder,shared} (issue #63,
      # part of epic #59/#60). Mirrors the Dart job's ratchet philosophy
      # (`tools/coverage_dart.dart --floor`): the floor must never regress,
      # and is raised toward 100% as tests land. `cpp.lcov` already excludes
      # generated code (`gen/`), test sources, and the build tree (see the
      # capture step above); `dart/self_host/lib/engine_rt.cpp` is excluded
      # implicitly too — it is gitignored and never generated by this job, so
      # it is never compiled/instrumented in the first place.
      #
      # Uses `lcov --summary`'s "lines......: NN.N% (a of b)" aggregate, NOT
      # `--list`'s per-file table — the per-file Rate% column is unreliable on
      # a merged (baseline + post-test) tracefile once multiple TUs' data for
      # the same header are combined (confirmed by cross-checking against
      # Codecov's own per-file computation; see cpp/build-cov-floor.sh for the
      # full writeup and the local standalone per-target version of this
      # check used during development).
      - name: C++ line coverage floor
        run: |
          pct=$(lcov --summary cpp.lcov --ignore-errors empty 2>/dev/null \
            | grep -oP 'lines\.*:\s*\K[0-9]+(\.[0-9]+)?' | head -1)
          if [ -z "$pct" ]; then
            echo "ERROR: could not parse line coverage percentage from cpp.lcov"
            exit 1
          fi
          # Ratcheted 72 -> 83 -> 86 -> 87 -> 91 (issue #63).
          #
          # LATEST MEASUREMENT — SIX consecutive runs of this workflow on main,
          # spanning six commits, all printing the identical number (read from
          # `gh api repos/Ball-Lang/ball/actions/jobs/<id>/logs`):
          #   run 34740025834 44d7177f / 34741799437 a796c3ea /
          #   34742610281 af471b96 / 34743380653 1207d677 /
          #   34746079045 97927362 / 34749011302 92148281
          #     C++ overall line coverage: 93.9% (floor: 87%)
          # 91 is that 93.9 minus this project's ~2pt CI-variance buffer,
          # rounded down to whole points. The previous 87 was derived on
          # 2026-07-14 against an 88.3% reading and had since drifted 6.9pt
          # below what CI measures — wide enough that every test #495 and #587
          # added could have been deleted with this gate still green.
          # (Run 34746079045's workflow conclusion is `failure` and so is its
          # `C++ coverage` JOB's: steps 11 and 12 — this floor and the per-target
          # one below — both passed with exactly these numbers, and the job then
          # died in step 13 on a codecov OIDC token-fetch timeout. Judge a
          # coverage.yml run by those two FLOOR STEPS, by name, not by the job's
          # or the run's conclusion. That run is why the upload no longer lives
          # in this job at all (#638), so for runs after this commit the job
          # conclusion and the floor verdict coincide again — but the rule that
          # outlives the fix is: read the steps.)
          #
          # The per-target numbers behind the aggregate (compiler / encoder /
          # shared) have their own, finer floors, and the step below GATES on
          # them via cpp/build-cov-floor.sh — this aggregate is the blended
          # backstop, not the only check. See that step.
          floor=91
          echo "C++ overall line coverage: ${pct}% (floor: ${floor}%)"
          awk -v p="$pct" -v f="$floor" 'BEGIN {
            if (p + 0 < f) {
              print "ERROR: " p "% is below the floor of " f "%. Add tests " \
                    "(target: 100%) or, only with justification, lower the " \
                    "floor in this workflow.";
              exit 1;
            }
            print "OK: " p "% >= floor " f "%.";
          }'

      # Per-target split + GATE (issues #63 / #59). The aggregate floor above is
      # blended across cpp/{compiler,encoder,shared}: a large regression
      # confined to one target — `shared` is a small slice of the ~11.4k-line
      # denominator — is arithmetically absorbable by the other two and never
      # trips it. cpp/build-cov-floor.sh has owned the finer per-target floors
      # since it was written, and is unit-pinned by
      # cpp/test/test_build_cov_floor_parsing.sh — but it was invoked by
      # NOTHING: `grep -rn build-cov-floor .github/workflows/` returned only
      # prose comments, and #495's predecessor of this step RE-IMPLEMENTED the
      # extraction inline, echoing "not enforced" and never comparing anything.
      # A proven-correct exit code that reaches no job is not a gate.
      #
      # #495 left it report-only on purpose ("measure before gating"): those
      # floors had never been measured by CI. They have now. Two consecutive
      # SUCCESSFUL runs of THIS workflow on main printed an identical triple:
      #   run 33614144984  main @ edf9f6c6  2026-09-02T09:39Z
      #   run 33617428731  main @ 5b8c7b18  2026-09-02T10:16Z
      #     cpp/compiler: 92.3%   cpp/encoder: 89.1%   cpp/shared: 81.8%
      # so build-cov-floor.sh's FLOORS were re-derived from that measurement
      # minus this project's ~2pt CI-variance buffer (90 / 87 / 79) and this
      # step now INVOKES the script rather than duplicating its comparison.
      # RATCHETED again 2026-09-13 to 92 / 97 / 92, against six consecutive
      # agreeing runs measuring 94.6 / 99.0 / 94.3 — the run ids and the reason
      # the old floors had drifted 4.6-15.3pt low are in build-cov-floor.sh's
      # header, which is where these numbers live.
      # The script's exit code IS the step's exit code — deliberately no
      # `continue-on-error`, which would swallow it and demote the gate back to
      # an annotation.
      #
      # The emptiness assertion below is not optional. build-cov-floor.sh's
      # missing-tracefile branch is a deliberate non-fatal SKIP (the local
      # operator-error case: the script run before build-cov-report.sh), so a
      # step that silently extracted zero tracefiles would "pass" a gate that
      # checked nothing. The OK-line count is the same guarantee from the other
      # side. This is the positive-floor discipline of #439/#444: an exit code
      # alone cannot distinguish "all passed" from "nothing ran".
      #
      # cpp/test/test_cov_floor_ci_wiring.sh (run by ci.yml's always-on `proto`
      # job) asserts that this step still names build-cov-floor.sh, so the
      # duplication this replaces cannot silently come back.
      - name: C++ per-target coverage floors (compiler/encoder/shared — gated)
        run: |
          set -uo pipefail
          # build-cov-floor.sh cds to cpp/ and reads build-cov/cpp.<t>.lcov.
          mkdir -p cpp/build-cov
          for target in compiler encoder shared; do
            out="cpp/build-cov/cpp.$target.lcov"
            lcov --extract cpp.lcov "*/cpp/$target/*" --output-file "$out" \
              --ignore-errors unused,empty --quiet
            if [ ! -s "$out" ]; then
              echo "::error::$out is missing or empty — the per-target extraction produced nothing, so build-cov-floor.sh would SKIP it and the gate would prove nothing."
              exit 1
            fi
          done
          bash cpp/build-cov-floor.sh | tee cov-floor.txt
          rc=${PIPESTATUS[0]}
          {
            echo "### C++ per-target line coverage (gated — issue #63)"
            echo ""
            echo '```'
            cat cov-floor.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # ORDER MATTERS. A genuine below-floor regression makes the script
          # exit 1 AND print only 2 OK lines, so an OK-count check placed first
          # would fail the step with "this gate checked nothing" — red for the
          # right reason but reported as the wrong cause, sending the next
          # reader after a phantom extraction bug. The script has already
          # printed the real diagnosis (which target, measured vs floor) into
          # cov-floor.txt above, so surface its exit FIRST and let the
          # positive-floor assertion below speak only for the case it actually
          # diagnoses: a silent SKIP, where the script exits 0 having checked
          # fewer than three targets.
          if [ "$rc" -ne 0 ]; then
            echo "::error::cpp/build-cov-floor.sh failed (exit $rc) — see the per-target lines above for the target that regressed or could not be parsed."
            exit "$rc"
          fi
          # `grep -c` exits 1 on zero matches; `|| true` keeps that from
          # aborting, and the anchored pattern keeps the count a single line so
          # the numeric test below can never take a multi-line operand.
          ok=$(grep -c '^OK ' cov-floor.txt || true)
          if [ "${ok:-0}" -ne 3 ]; then
            echo "::error::build-cov-floor.sh exited 0 but printed ${ok:-0} of 3 per-target OK lines — a target was SKIPPED (missing tracefile), so this gate checked nothing."
            exit 1
          fi

  # ──────────────────────────────────────────────────
  # Rust — cargo-llvm-cov over the default-feature workspace
  # ──────────────────────────────────────────────────
  rust:
    name: Rust coverage
    # The pull_request trigger is scoped to cpp/** for the C++ job's sake
    # (issue #63); this job stays push/dispatch-only so a cpp-only PR does
    # not drag the whole cross-stack coverage matrix into it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # rustup ships preinstalled on GitHub-hosted runners; `rustup show` reads
      # rust/rust-toolchain.toml (channel = stable) and installs it (mirrors
      # ci.yml's rust job). llvm-tools-preview is the extra component
      # cargo-llvm-cov instruments with (source-based coverage via LLVM, not
      # gcov/lcov like the C++ job).
      - name: Install Rust toolchain
        working-directory: rust
        run: |
          rustup show
          rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: cargo-llvm-cov

      # Default-feature workspace only (mirrors ci.yml's plain `cargo build
      # --workspace` / `cargo test --workspace`) — deliberately NOT
      # `--features self_host`. The self-hosted engine (`ball-lang-engine`'s
      # `compiled_engine.rs`) is a gitignored, generated artifact that first
      # needs `dart pub get` + `gen_engine_json.dart` + `cargo run -p
      # ball-engine-regen` (see ci.yml's dedicated steps) — pulling that whole
      # dance into this job would double its runtime to instrument a single
      # generated file that's excluded from coverage anyway (see codecov.yml's
      # `ignore:` list, mirroring the TS/C++ generated-file exclusions). This
      # keeps the job lean while still measuring every authored crate
      # (ball-lang-shared, ball-lang-compiler, ball-lang-encoder, ball-lang-engine's wrapper
      # foundation, ball-lang-cli).
      - name: Coverage — cargo-llvm-cov (workspace, default features)
        run: cd rust && cargo llvm-cov --workspace --lcov --output-path ../rust.lcov

      # Transport out of the measurement job, before the gate below (#638).
      - name: Publish the Rust lcov for the upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov-rust
          path: rust.lcov
          if-no-files-found: error
          retention-days: 7

      # Line-coverage ratchet for the authored rust/ crates (epic #59) —
      # mirrors the Dart (`coverage_dart.dart --floor`) and C++ ("C++ line
      # coverage floor") gates: the floor must never regress and is raised
      # toward 100% as tests land. `report` reuses the profdata the step
      # above already collected (no test rerun). Generated files are excluded
      # from the GATE only (`gen/` proto bindings + the self-host
      # `compiled_engine.rs`, mirroring codecov.yml's `ignore:` list and the
      # other stacks' generated-file exclusions); the uploaded rust.lcov is
      # unchanged — Codecov applies the same ignores server-side. Authored
      # coverage measured 67.3% lines by this exact command (2026-07-10;
      # Codecov flag `rust` reads 68.1% with its own accounting); floor set
      # below it to absorb run-to-run variance. RAISE toward 100% as tests
      # land; never lower it without justification.
      - name: Rust line coverage floor
        run: >
          cd rust && cargo llvm-cov report
          --ignore-filename-regex '(^|/)gen/|compiled_engine\.rs'
          --fail-under-lines 65
          --summary-only

  # ──────────────────────────────────────────────────
  # C# — coverlet (VSTest "XPlat Code Coverage") → lcov, merged via
  # ReportGenerator (issue #386)
  # ──────────────────────────────────────────────────
  csharp:
    name: C# coverage
    # The pull_request trigger is scoped to cpp/** for the C++ job's sake
    # (issue #63); this job stays push/dispatch-only so a cpp-only PR does
    # not drag the whole cross-stack coverage matrix into it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      # coverlet.collector (the "XPlat Code Coverage" VSTest data collector,
      # already referenced by every csharp/*/test/*.csproj — see
      # Directory.Packages.props) instruments each of the 5 default-build test
      # projects independently. csharp/coverlet.runsettings switches its
      # output format to lcov and excludes generated sources (buf-generated
      # protobuf bindings + the gitignored self-hosted CompiledEngine.cs/
      # CompiledCli.cs — absent from this default, non-SelfHost/non-CliCore
      # build anyway), mirroring codecov.yml's ignore list and the other
      # stacks' generated-file exclusions.
      - name: Test with coverage (coverlet, all 5 packages)
        run: >
          dotnet test csharp/Ball.slnx --collect:"XPlat Code Coverage"
          --settings csharp/coverlet.runsettings
          --results-directory csharp/coverage-raw

      # VSTest integration doesn't merge multi-project coverage or compute a
      # summary on its own (unlike coverlet's dotnet/msbuild integration) —
      # ReportGenerator merges the 5 per-project coverage.info files into one
      # lcov.info for Codecov, and its TextSummary report gives the overall
      # "Line coverage: NN.N%" the floor gate below parses.
      - name: Install ReportGenerator
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Merge coverage (ReportGenerator)
        run: >
          reportgenerator "-reports:csharp/coverage-raw/**/coverage.info"
          "-targetdir:csharp/coverage-report" "-reporttypes:lcov;TextSummary"

      # Transport out of the measurement job, before the gate below (#638).
      - name: Publish the C# lcov for the upload job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov-csharp
          path: csharp/coverage-report/lcov.info
          if-no-files-found: error
          retention-days: 7

      # Line-coverage floor for the authored csharp/ packages (issue #386,
      # epic #59/#60) — mirrors the Dart/C++/Rust ratchet philosophy: the
      # floor must never regress, and is raised toward 100% as tests land.
      # Measured 65.3% locally (2026-07-12, Directory.Packages.props-pinned
      # coverlet.collector 10.0.1 + ReportGenerator 5.5.10, all 5 default-build
      # test projects); floor set a few points below to absorb CI variance.
      - name: C# line coverage floor
        run: |
          pct=$(grep -oP 'Line coverage: \K[0-9]+(\.[0-9]+)?' csharp/coverage-report/Summary.txt)
          if [ -z "$pct" ]; then
            echo "ERROR: could not parse line coverage percentage from Summary.txt"
            exit 1
          fi
          floor=60
          echo "C# overall line coverage: ${pct}% (floor: ${floor}%)"
          awk -v p="$pct" -v f="$floor" 'BEGIN {
            if (p + 0 < f) {
              print "ERROR: " p "% is below the floor of " f "%. Add tests " \
                    "(target: 100%) or, only with justification, lower the " \
                    "floor in this workflow.";
              exit 1;
            }
            print "OK: " p "% >= floor " f "%.";
          }'

  # ──────────────────────────────────────────────────
  # Codecov upload — TRANSPORT ONLY (issue #638)
  #
  # WHY THIS JOB EXISTS. Until #638 every measurement job ended by uploading its
  # own lcov to Codecov, so one job's exit code answered two different questions:
  # "did coverage hold?" and "did the upload reach codecov.io?". Run 34746079045
  # on main is what that costs: its `C++ coverage` job passed step 11 (`C++ line
  # coverage floor`, 93.9% >= 91%) and step 12 (`C++ per-target coverage floors`,
  # 94.6/99.0/94.3 >= 92/97/92) and then FAILED step 13 on
  #   Unhandled error: Failed to get ID Token. Request timeout:
  #   …/idtoken/…&audience=https%3A%2F%2Fcodecov.io
  # — a GitHub OIDC hiccup. main's coverage history therefore records a red on a
  # commit whose coverage was fine, which is precisely the signal #63's ratchet
  # and #599's cache ceiling are derived from.
  #
  # Now each measurement job publishes `coverage-lcov-<flag>` and ENDS on its
  # floor steps, so its conclusion IS the measurement; this job carries the
  # bytes. A red here means "upload broken" and nothing else.
  #
  # WHY `fail_ci_if_error: false` WAS NOT ENOUGH, AND WHY THE RETRY IS OURS.
  # codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f is v7.0.0
  # (https://github.com/codecov/codecov-action/blob/v7.0.0/action.yml), a
  # COMPOSITE action. `fail_ci_if_error` becomes CC_FAIL_ON_ERROR on its LAST
  # step only (dist/codecov.sh). The token is fetched FOUR steps earlier by the
  # 5th of that file's 9 composite steps, `Get OIDC token`
  # (actions/github-script -> core.getIDToken(audience)), which has no `if:`, no
  # retry and no continue-on-error and is not affected by that input at
  # all — and v7.0.0 exposes NO retry input of any kind (none of its 49 inputs
  # matches retry/attempt/backoff). So the token is fetched
  # here instead, with a bounded retry, and handed over through the action's
  # documented `token` input: action.yml funnels `use_oidc`'s token and the
  # `token` input into the same CC_TOKEN, so dist/codecov.sh cannot tell them
  # apart. If a future codecov-action gains a real retry input, THAT is the
  # moment to delete this step — and
  # tools/ci/check_coverage_upload_isolation.sh is the assertion to update.
  # ──────────────────────────────────────────────────
  codecov-upload:
    name: Codecov upload
    needs: [dart, typescript, cpp, rust, csharp]
    # `!cancelled()` rather than `always()`: a cancelled run has nothing worth
    # publishing, but a measurement job that FAILED its floor still produced an
    # lcov whose numbers Codecov must record — the drop is the interesting run.
    # The four jobs pinned to non-PR events simply contribute no artifact on a
    # pull_request, and a `needs` on a skipped job would otherwise skip this one.
    #
    # The fork clause is not squeamishness: a `pull_request` from a fork gets a
    # read-only GITHUB_TOKEN, so GitHub issues no OIDC token however the
    # workflow's `permissions:` are written, and the fetch below would fail loud
    # for something the contributor cannot fix. codecov-action covers that case
    # with its own tokenless `CC_FORK` path, which is a different mechanism with
    # different trust; this job does not pretend to. Nothing is lost — the
    # push-to-main run after the merge publishes the same commits.
    if: >-
      ${{ !cancelled()
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The Codecov CLI walks the repository to build the report's file network
      # and to apply path fixes, so the checkout is not optional.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ONE STEP PER FLAG, each with `pattern:` + `merge-multiple: true` into its
      # OWN directory. Two properties are needed at once and only this shape has
      # both:
      #   * `pattern:` (not `name:`) so a stack whose measurement job was skipped
      #     or died before producing its lcov is simply absent — with `name:` a
      #     missing artifact is a hard error, which would red the transport job
      #     for something that is not a transport problem. The assertion below is
      #     what decides whether an absence is legitimate.
      #   * a DETERMINISTIC destination. A single `pattern: coverage-lcov-*` step
      #     does not give one: download-artifact v8.0.1 writes into
      #     `path/<artifact-name>/` only when more than one artifact matches
      #     (`isSingleArtifactDownload || inputs.mergeMultiple ||
      #     artifacts.length === 1 ? resolvedPath : path.join(resolvedPath,
      #     artifact.name)` in its src/download-artifact.ts), so on a
      #     cpp-only pull_request the file landed at `coverage-artifacts/cpp.lcov`
      #     and every `files:`/`hashFiles()` path below missed it. `merge-multiple:
      #     true` pins the layout to "straight into `path`" for any match count.
      # Downloaded INTO the workspace because `hashFiles()` resolves relative to
      # GITHUB_WORKSPACE only.
      - name: Download the Dart lcov
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-lcov-dart
          merge-multiple: true
          path: coverage-artifacts/coverage-lcov-dart

      - name: Download the TypeScript lcov
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-lcov-typescript
          merge-multiple: true
          path: coverage-artifacts/coverage-lcov-typescript

      - name: Download the C++ lcov
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-lcov-cpp
          merge-multiple: true
          path: coverage-artifacts/coverage-lcov-cpp

      - name: Download the Rust lcov
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-lcov-rust
          merge-multiple: true
          path: coverage-artifacts/coverage-lcov-rust

      - name: Download the C# lcov
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-lcov-csharp
          merge-multiple: true
          path: coverage-artifacts/coverage-lcov-csharp

      # POSITIVE FLOOR (#439/#444): an exit code cannot tell "every upload
      # succeeded" from "there was nothing to upload". A stack whose measurement
      # job SUCCEEDED must have left its lcov here; one that failed may
      # legitimately have died before producing it, and one that was skipped
      # never ran at all.
      - name: Assert every measured stack left its lcov here
        env:
          RESULTS: >-
            dart=${{ needs.dart.result }}
            typescript=${{ needs.typescript.result }}
            cpp=${{ needs.cpp.result }}
            rust=${{ needs.rust.result }}
            csharp=${{ needs.csharp.result }}
        run: |
          set -uo pipefail
          missing=0
          present=0
          expected=0
          for entry in $RESULTS; do
            flag="${entry%%=*}"
            result="${entry#*=}"
            dir="coverage-artifacts/coverage-lcov-$flag"
            files=""
            if [ -d "$dir" ]; then
              files="$(find "$dir" -type f -size +0c | head -20)"
            fi
            case "$result" in
            skipped | cancelled)
              echo "SKIP  $flag: its measurement job did not run for this event ($result)."
              continue
              ;;
            success)
              expected=$((expected + 1))
              ;;
            esac
            if [ -n "$files" ]; then
              present=$((present + 1))
              echo "OK    $flag ($result):"
              printf '        %s\n' $files
            elif [ "$result" = "success" ]; then
              missing=$((missing + 1))
              echo "::error::$flag's measurement job succeeded but left no lcov artifact — this upload job would have published nothing for it and still gone green."
            else
              echo "NOTE  $flag: its measurement job concluded '$result' and produced no lcov; nothing to upload for this flag."
            fi
          done
          echo "lcov artifacts present: $present (expected at least $expected)"
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          if [ "$expected" -gt 0 ] && [ "$present" -eq 0 ]; then
            echo "::error::no lcov artifact reached this job although $expected measurement job(s) succeeded."
            exit 1
          fi

      # The exact request that timed out in run 34746079045, with a bounded
      # retry. ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN are handed to every step by
      # the workflow-level `permissions: id-token: write`, and the URL already
      # carries `?api-version=2.0`, so the audience is appended with `&` —
      # pre-encoded here exactly as core.getIDToken() encodes it.
      - name: Fetch the Codecov OIDC token (bounded retry)
        id: oidc
        env:
          AUDIENCE_ENCODED: https%3A%2F%2Fcodecov.io
        run: |
          set -uo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] ||
            [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::no ACTIONS_ID_TOKEN_REQUEST_* in the environment — this job needs id-token: write."
            exit 1
          fi
          attempts=3
          i=1
          while [ "$i" -le "$attempts" ]; do
            rc=0
            body="$(curl --silent --show-error --fail \
              --connect-timeout 10 --max-time 30 \
              --retry 2 --retry-delay 2 --retry-connrefused \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              -H "Accept: application/json" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE_ENCODED}" 2>&1)" || rc=$?
            if [ "$rc" -eq 0 ]; then
              token="$(printf '%s' "$body" |
                python3 -c 'import json,sys; print(json.load(sys.stdin).get("value",""))')"
              if [ -n "$token" ]; then
                echo "::add-mask::$token"
                echo "token=$token" >>"$GITHUB_OUTPUT"
                echo "Codecov OIDC token acquired on attempt $i/$attempts (length ${#token})."
                exit 0
              fi
              echo "attempt $i/$attempts: the token endpoint returned no \`value\` field."
            else
              echo "attempt $i/$attempts: curl exited $rc."
            fi
            i=$((i + 1))
            if [ "$i" -le "$attempts" ]; then
              sleep $((i * 5))
            fi
          done
          echo "::error::could not fetch the Codecov OIDC token after $attempts attempts — this is TRANSPORT, not coverage: every floor in this run is reported by its own measurement job."
          exit 1

      # One step per flag, because `flags:` takes a single value per upload.
      # Each is gated on `!cancelled()` so one broken flag does not hide the
      # other four — a failed step is not rescued by later steps running, so the
      # JOB still ends red — and on `steps.oidc.conclusion` so a dead token does
      # not turn into five confusing tokenless rejections.
      #
      # `disable_search: true` is mandatory now that all five stacks' lcov share
      # one workspace: a searching uploader would tag every stack's report with
      # this step's flag. `fail_ci_if_error: true` is the point of the whole
      # change — the upload can no longer touch a coverage verdict, so when it
      # breaks it must say so out loud instead of passing silently.
      - name: Upload Dart coverage to Codecov
        if: ${{ !cancelled() && steps.oidc.conclusion == 'success' && hashFiles('coverage-artifacts/coverage-lcov-dart/**') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ steps.oidc.outputs.token }}
          disable_search: true
          files: ./coverage-artifacts/coverage-lcov-dart/dart.lcov
          flags: dart
          fail_ci_if_error: true

      - name: Upload TypeScript coverage to Codecov
        if: ${{ !cancelled() && steps.oidc.conclusion == 'success' && hashFiles('coverage-artifacts/coverage-lcov-typescript/**') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ steps.oidc.outputs.token }}
          disable_search: true
          files: >-
            ./coverage-artifacts/coverage-lcov-typescript/engine.lcov,./coverage-artifacts/coverage-lcov-typescript/compiler.lcov,./coverage-artifacts/coverage-lcov-typescript/encoder.lcov,./coverage-artifacts/coverage-lcov-typescript/shared.lcov,./coverage-artifacts/coverage-lcov-typescript/cli.lcov
          flags: typescript
          fail_ci_if_error: true

      - name: Upload C++ coverage to Codecov
        if: ${{ !cancelled() && steps.oidc.conclusion == 'success' && hashFiles('coverage-artifacts/coverage-lcov-cpp/**') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ steps.oidc.outputs.token }}
          disable_search: true
          files: ./coverage-artifacts/coverage-lcov-cpp/cpp.lcov
          flags: cpp
          fail_ci_if_error: true

      - name: Upload Rust coverage to Codecov
        if: ${{ !cancelled() && steps.oidc.conclusion == 'success' && hashFiles('coverage-artifacts/coverage-lcov-rust/**') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ steps.oidc.outputs.token }}
          disable_search: true
          files: ./coverage-artifacts/coverage-lcov-rust/rust.lcov
          flags: rust
          fail_ci_if_error: true

      - name: Upload C# coverage to Codecov
        if: ${{ !cancelled() && steps.oidc.conclusion == 'success' && hashFiles('coverage-artifacts/coverage-lcov-csharp/**') != '' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ steps.oidc.outputs.token }}
          disable_search: true
          files: ./coverage-artifacts/coverage-lcov-csharp/lcov.info
          flags: csharp
          fail_ci_if_error: true
