name: Release Go modules

# ─────────────────────────────────────────────────────────────────────────────
# The Go module lane, fully automated (#361) — RELEASE VIA PR since #879, the
# go-release.yml sibling of release.yml's own issue #755 fix.
#
# WHAT THIS REPLACED (twice). First, `tag-go-modules.yml` cut the six
# `go/<module>/vX.Y.Z` tags automatically since #361 — but only ever at the
# version already written into the `go/*/go.mod` files, and moving THAT number
# was a human action. #623 made the version itself a semantic-release line
# (`.github/release/go.releaserc.json`), whose `@semantic-release/git` step then
# pushed the version-bump commit straight to `main` — which is exactly the
# `Protect main` ruleset's GH013 rejection (17056238, 19 required status checks
# on every push to `main` itself since 2026-09-13) issue #755 fixed for the root
# npm line. docs/RELEASE.md's "What is explicitly NOT fixed here" note on PR
# #881 tracked this as issue #879; this file is that fix.
#
# THE MODEL NOW mirrors release.yml exactly — two INDEPENDENT jobs, not two
# steps of one (see release.yml's header for the full "job split, not a step
# reorder" rationale; it applies here verbatim, because this lane shares the
# exact same `tools/release/open_bot_pr.sh` auto-merge mechanism):
#   Phase 1 (`open-release-pr`, tools/release/open_go_release_pr.sh) computes
#     the next Go module version via a semantic-release DRY RUN (no push, no
#     tag), and if there is one, opens-or-refreshes an auto-merging PR carrying
#     the REAL `bump_go_modules.sh` edit + a go/CHANGELOG.md prepend on a
#     `release/go-next` branch.
#   Phase 2 (`finish-release`, tools/release/finish_go_release.sh) scans every
#     commit since the last `go-modules/vX.Y.Z` tag for the oldest Go
#     release-PR merge (`chore(release): go vX.Y.Z`, with or without the
#     ` (#N)` the merge queue appends), and ONLY when it finds one tags THAT
#     commit `go-modules/vX.Y.Z` and dispatches-and-awaits `tag-go-modules.yml`
#     at that tag (unchanged from before — see that script's header for the
#     #627 "awaited, not fire-and-forget" rationale).
#
# WHO DISPATCHES Phase 1, AND WHEN: unchanged. `release.yml`'s `finish-release`
# job still runs `gh workflow run go-release.yml --ref main` once it has
# ACTUALLY tagged a root release (`steps.finish.outputs.newly_tagged ==
# 'true'`) — see that file. That dispatch now lands on THIS workflow's
# `workflow_dispatch` trigger with `dry_run` defaulting to `false` (a real
# run), exactly as it did when this file ran semantic-release directly.
#
# `schedule` EXISTS on Phase 2 for the identical reason release.yml's
# `finish-release` job has one: an auto-merge armed with `GITHUB_TOKEN` is
# enqueued and merged on that token's behalf, so the resulting push cannot be
# relied on to trigger anything (see release.yml's header for the citations).
# `push` stays wired as a cheap fallback for a human-merged `main`. The same
# token is why the Go release PR's merge group gets no `merge_group` run;
# bot-merge-queue.yml dispatches its required checks (PR #881 review round 3).
#
# `workflow_dispatch`'s `dry_run` input rehearses Phase 1's computation on ANY
# branch with zero side effects — unchanged behavior from before this fix,
# down to the identical limitation release.yml's own rehearsal has: run off
# `main`, semantic-release's env-ci branch detection reports "configured to
# only publish from main" and computes nothing (PR #881 review round 2,
# finding 4) — a dry run only proves the shape, never the live verdict, which
# is why `tools/go-module-proxy/bump_go_modules.sh`'s own `--check-next` mode
# and the lane's existing unit tests cover the computation's correctness.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  schedule:
    # Every 15 minutes — the recovery poll for `finish-release`. Cheap (git +
    # gh only, no toolchain install), so a tight interval is affordable;
    # `concurrency:` on that job serialises overlapping ticks.
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run only — compute the next Go module version, create no branch, PR, tag or dispatch. Use this to rehearse."
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  # gh workflow run (Phase 1 dispatches ci.yml/regression-gates.yml; Phase 2
  # dispatches-and-awaits tag-go-modules.yml via await_workflow_run.py)
  actions: write

jobs:
  # ──────────────────────────────────────────────────
  # Phase 1 — via PR (issue #879, see this file's header). Opens/refreshes
  # the version-bump PR only; tagging + the tag-go-modules.yml dispatch
  # happen in the independent `finish-release` job below, once that PR has
  # merged.
  # ──────────────────────────────────────────────────
  open-release-pr:
    name: Open the Go module release PR
    if: github.event_name != 'schedule' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A REAL run always computes from the tip of main's history (the
          # bootstrap step and the dry run both need full tag history); a
          # DRY RUN checks out the dispatched ref instead, so a rehearsal can
          # exercise a change to this lane itself before it merges.
          ref: ${{ inputs.dry_run && github.ref || 'main' }}
          fetch-depth: 0
          # Credentials ARE persisted (the default): open_go_release_pr.sh
          # pushes a branch with plain `git push`, not through a plugin that
          # manages its own auth.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/release/package-lock.json

      - name: Install release toolchain
        run: cd tools/release && npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rehearsal — show what Phase 1 would compute (dry run only)
        if: inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash tools/go-module-proxy/bootstrap_channel_tag.sh
          cp .github/release/go.releaserc.json .releaserc.json
          node tools/release/compute_next_release.mjs
          rm -f .releaserc.json

      - name: Phase 1 — open/refresh the auto-merging Go release PR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/release/open_go_release_pr.sh

  # ──────────────────────────────────────────────────
  # Phase 2 — via PR (issue #879, see this file's header). Independent of
  # `open-release-pr` by design: it must run even when the `schedule`
  # recovery poll is the only thing that triggered this workflow, and it
  # must be cheap enough to poll every 15 minutes forever. Finds the oldest
  # untagged Go release-PR merge since the last `go-modules/vX.Y.Z` tag
  # (anywhere in that range, not just at HEAD), and ONLY then tags it and
  # dispatches-and-awaits tag-go-modules.yml.
  # ──────────────────────────────────────────────────
  finish-release:
    name: Finish a merged Go release PR
    if: |
      github.event_name == 'push' || github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialises overlapping attempts (a `push` run racing a `schedule` tick,
    # or two ticks if one runs long) instead of letting two of them tag
    # concurrently; never cancels one mid-tag. Scoped to THIS lane only — a
    # tag push here (`go-modules/vX.Y.Z`) cannot collide with the root line's
    # `vX.Y.Z` tag push or pub.dev's `<pkg>-vX.Y.Z` tag push, so there is no
    # need to share a group with either.
    concurrency:
      group: go-release-finish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Credentials ARE persisted (the default): finish_go_release.sh
          # pushes a tag with plain `git push`, not through a plugin that
          # manages its own auth.

      - name: Phase 2 — finish a Go release PR that just merged
        id: finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/release/finish_go_release.sh
