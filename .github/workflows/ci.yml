name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  # Toolchain-drift canary. Every job below installs a FLOATING toolchain
  # (`dart-lang/setup-dart` with `sdk: stable`, `actions/setup-node`, …), so a
  # release of any of them can turn `main` red with zero commits — and, with
  # only push/pull_request triggers, that red is first seen on the next
  # contributor's unrelated PR (2026-09-02: a new stable Dart lint,
  # `unawaited_return_in_try_block`, failed `dart analyze dart/` on a C#-only
  # PR, seven weeks after main's last full run). A weekly run on main surfaces
  # the drift where it belongs. The `changes` job below has no diff base on a
  # schedule/dispatch event and FAILS OPEN, so every stack runs — that is the
  # intent, not a gap.
  schedule:
    - cron: "0 5 * * 1" # Weekly on Monday at 05:00 UTC (an hour before conformance-matrix.yml)
  workflow_dispatch:

# Least-privilege default token: read-only. No job in this workflow writes to
# the repo (build + test only). https://docs.github.com/actions/security
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────
  # Detect which stacks a PR/push touched, so the heavy per-stack jobs below can
  # skip when nothing in their stack changed. The whole body lives in the
  # ./.github/actions/detect-changed-stacks composite action — the SINGLE source
  # of truth shared with regression-gates.yml's identically-named job (#458);
  # it used to be two hand-copied inline bash blocks that silently drifted
  # (#451/#457). Behaviour is pinned by that action's truth_table.sh, which the
  # `proto` job below runs on every PR. FAIL-OPEN: if a real diff base can't be
  # determined (first push, force-push, zero/missing base), every output is
  # `true` so NO check is ever silently skipped. `infra` (proto/** or a
  # workflow) forces every stack to run, since protos feed all bindings. The
  # post-merge conformance-matrix re-runs the full cross-language matrix
  # regardless, as a safety net.
  # ──────────────────────────────────────────────────
  changes:
    name: Detect changed stacks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dart: ${{ steps.f.outputs.dart }}
      ts: ${{ steps.f.outputs.ts }}
      cpp: ${{ steps.f.outputs.cpp }}
      rust: ${{ steps.f.outputs.rust }}
      csharp: ${{ steps.f.outputs.csharp }}
      go: ${{ steps.f.outputs.go }}
      python: ${{ steps.f.outputs.python }}
      infra: ${{ steps.f.outputs.infra }}
      # A self-hosted Dart source (dart/engine/lib/** or the cli_core.dart
      # library) changed — already folded into cpp/rust/csharp below (#416,
      # #386). Exposed for observability/debugging; no downstream job
      # consumes it directly.
      self_host: ${{ steps.f.outputs.self_host }}
      # New/changed conformance fixture stems (space-separated, no dir, no
      # extension), or the `ALL` fail-open sentinel — see the composite action.
      changed_fixtures: ${{ steps.f.outputs.changed_fixtures }}
    steps:
      # fetch-depth: 0 (full history, so the merge-base of the diff is
      # reachable) is the composite action's documented precondition; checkout
      # deliberately stays in the caller rather than moving into the action.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - id: f
        uses: ./.github/actions/detect-changed-stacks

  # ──────────────────────────────────────────────────
  # Proto — lint, format, breaking change check
  # ──────────────────────────────────────────────────
  proto:
    name: Proto Checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # needed for buf breaking against git history

      - uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1
        with:
          setup_only: true

      - name: Lint
        run: buf lint proto/

      - name: Format check
        run: buf format proto/ --diff --exit-code

      - name: Breaking change check
        if: github.event_name == 'pull_request'
        run: buf breaking proto/ --against ".git#subdir=proto"

      # ── CI-plumbing unit tests. They live in this always-run job (no
      # toolchain, sub-second each) precisely because the things they pin are
      # what decides whether the OTHER jobs run at all — gating them behind
      # `changes` would be the chicken-and-egg version of the bug they guard.
      # Each prints a `Results: N passed, M failed, T total` line and refuses
      # to report success on zero cases.
      - name: Changed-stacks truth table (#458)
        run: bash .github/actions/detect-changed-stacks/test/truth_table.sh

      - name: C++ coverage-floor parser test (#63)
        run: bash cpp/test/test_build_cov_floor_parsing.sh

      # The parser test above proves build-cov-floor.sh's comparison and exit
      # codes; it runs the script directly and therefore cannot notice that
      # coverage.yml used to RE-IMPLEMENT that comparison inline and never call
      # it (#63/#59). This one asserts the wiring itself.
      - name: C++ coverage-floor CI wiring test (#63)
        run: bash cpp/test/test_cov_floor_ci_wiring.sh

      # Same technique, pointed for the first time at a raw external-network
      # command instead of a repo-owned script: every `dart pub get` in this
      # workflow must be retry-wrapped, so one transient pub.dev resolver hiccup
      # cannot redden a required job on a commit that changed nothing relevant
      # (run 33640533368's `Python` job, #520).
      - name: dart pub get retry wiring test (#520)
        run: bash .github/actions/dart-pub-get/test/test_dart_pub_get_wiring.sh

  # ──────────────────────────────────────────────────
  # Dart — analyze, format, all test suites
  # ──────────────────────────────────────────────────
  dart:
    name: Dart
    needs: changes
    # Dart + TS are coupled: the Dart compiler suite builds and shells out to
    # @ball-lang/compiler (ts/compiler), and ts tests regenerate from the Dart
    # self-host source. Run this cluster when either changed.
    if: ${{ needs.changes.outputs.dart == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      - name: Cache Dart pub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('dart/**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      # Node is needed by the Dart-side TsCompiler wrapper, which
      # shells out to @ball-lang/compiler (ts/compiler/). Without the
      # dist build the wrapper throws.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/compiler/package-lock.json

      - name: Install dependencies
        run: cd dart && dart pub get

      - name: Install & build @ball-lang/compiler
        run: cd ts/compiler && npm ci && npm run build

      - name: Analyze
        # Strict (warnings fatal) to match release.yml's pre-release analyze —
        # otherwise a warning passes PR CI but breaks every release (a BallMap
        # `undefined_shown_name` warning silently blocked releases past v1.42.0).
        run: dart analyze dart/

      - name: Format check
        run: dart format --set-exit-if-changed dart/

      - name: Shared tests
        run: cd dart/shared && dart test

      - name: ball_protobuf tests
        run: cd dart/ball_protobuf && dart test

      - name: Editions conformance (legacy↔editions parity + feature codecs)
        run: cd dart/ball_protobuf && dart run tool/editions_conformance.dart

      - name: Engine tests
        run: cd dart/engine && dart test

      - name: Encoder tests
        run: cd dart/encoder && dart test

      - name: Compiler tests
        run: cd dart/compiler && dart test --exclude-tags slow

      - name: Resolver tests
        run: cd dart/resolver && dart test

      # The `ball` CLI version is single-sourced from pubspec.yaml (#363);
      # fail if the generated lib/src/version.g.dart drifted from the package.
      - name: CLI version drift check (#363)
        run: cd dart/cli && dart run tool/gen_version.dart --check

      # cli.ball.json (+ .pb) is a generated, gitignored artifact — like
      # engine.ball.json — so self-encode cli_core here. The parity gate in the
      # CLI suite below then executes the portable verbs (info/validate/tree/
      # version) on the Ball engine and asserts byte-identical output vs native.
      - name: Generate self-hosted cli.ball.json (parity-gate input)
        run: cd dart && dart run compiler/tool/gen_cli_json.dart

      # dart/cli (depends on ball_compiler/ball_encoder/ball_engine/
      # ball_resolver, tested above). `--exclude-tags network` excludes only
      # the one test that hits the real pub.dev registry (ball_add's
      # `resolve` integration test) — that stays a manual/local-only check so
      # CI never depends on external network availability; every other CLI
      # test (arg parsing, command dispatch, mock-registry resolution,
      # local-file publish/init/add) runs here for real.
      - name: CLI tests
        run: cd dart/cli && dart test --exclude-tags network

      # engine_roundtrip.dart is a generated artifact (gitignored, like its
      # engine_rt.* siblings). Regenerate it from the live engine so the parity
      # test below has its import. Runs AFTER analyze/format so the generated
      # file is never linted. --skip-analyze: the tool's own analyze pass is
      # advisory (warnings only) and would slow the step.
      - name: Regenerate round-tripped engine (self-host source)
        run: cd dart/encoder && dart run tool/roundtrip_engine.dart --skip-analyze

      - name: Self-host parity (conformance via round-tripped engine)
        run: cd dart/self_host && dart test

      # The Tier A coverage-study harness (#493) is itself a measuring
      # instrument, so its own correctness IS gated here even though the study
      # it drives (coverage-study.yml) is report-only. The self-test proves the
      # harness scores `main`-less, cross-file library files instead of quietly
      # skipping them — the exact blind spot #493 exists to close.
      - name: Coverage-study harness self-test (#493)
        run: dart run tools/coverage-study/test/rq1_study_self_test.dart

  # ──────────────────────────────────────────────────
  # Ball artifact freshness — every committed Ball artifact must be GENERATED
  # from its Dart source, never hand-edited. Regenerate the deterministic shared
  # artifacts and fail if any drifted from the checked-in copy. The .json (text)
  # outputs are gated; each generator writes the sibling .bin in the same run,
  # so a fresh .json implies a fresh .bin (and avoids any binary cross-platform
  # serialization nondeterminism in the gate).
  # ──────────────────────────────────────────────────
  ball-freshness:
    name: Ball Artifact Freshness
    needs: changes
    if: ${{ needs.changes.outputs.dart == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      - name: Cache Dart pub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('dart/**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: cd dart && dart pub get

      - name: Regenerate shared Ball artifacts
        run: |
          ( cd dart/shared  && dart run bin/gen_std.dart . )
          ( cd dart/shared  && dart run bin/gen_ball_proto.dart . )
          ( cd dart/encoder && dart run bin/gen_ball_protobuf.dart ../shared )

      - name: Assert no drift
        run: |
          if ! git diff --exit-code -- \
              dart/shared/std.json \
              dart/shared/ball_proto.json \
              dart/shared/ball_protobuf.json; then
            echo "::error::A committed Ball artifact is stale. Regenerate it (see CLAUDE.md 'Build & Test' / 'Typical Feature Workflow') and commit the result — these files must never be hand-edited."
            exit 1
          fi
          echo "All shared Ball artifacts are up to date."

      # Every conformance .ball.json must be sourced from a src/<name>.dart, or
      # be an explicitly documented carve-out (tests/conformance/CARVEOUTS.md).
      - name: Assert conformance fixtures are sourced (no orphans)
        run: cd dart/encoder && dart run bin/check_conformance_sources.dart

      # FORWARD-direction completeness (the gap that hid #55): every std base
      # function the encoder can EMIT must be exercised by at least one executed
      # fixture, or be a documented carve-out
      # (tests/conformance/ENCODER_COMPLETENESS_CARVEOUTS.md).
      - name: Assert encoder completeness (no untested emittable constructs)
        run: cd dart/encoder && dart run bin/check_encoder_completeness.dart

      # A fixture's NAME must not overstate its coverage — no "false coverage"
      # like the old imperative 92_list_comprehension (which let #55 hide).
      - name: Assert fixture names match their content
        run: cd dart/encoder && dart run bin/check_fixture_names.dart

      # STRUCTURAL completeness: every Expression NODE SHAPE (the 7
      # Expression.expr types + meaningful sub-variants) must be exercised by at
      # least one executed fixture, or be a documented carve-out
      # (tests/conformance/NODE_SHAPE_COVERAGE_CARVEOUTS.md). Sibling to the
      # encoder-completeness gate above, which only gates std FUNCTIONS — this
      # closes the ungated node-shape surface (issue #64).
      - name: Assert node-shape coverage (no untested Expression shapes)
        run: cd dart/encoder && dart run bin/check_node_shape_coverage.dart

      # Every conformance .ball.json must be a fresh generator output, never
      # hand-edited. Regenerate from src and fail on drift.
      - name: Regenerate conformance corpus
        run: cd dart/encoder && dart run bin/generate_conformance.dart

      - name: Assert conformance corpus is up to date
        run: |
          if ! git diff --exit-code -- 'tests/conformance/*.ball.json'; then
            echo "::error::A conformance .ball.json is stale. Regenerate with 'cd dart/encoder && dart run bin/generate_conformance.dart' and commit — these files must never be hand-edited (see tests/conformance/CARVEOUTS.md for the only exceptions)."
            exit 1
          fi
          echo "Conformance corpus is up to date."

      # The std base-function coverage inventory (std_coverage.json +
      # STD_COVERAGE.md) is generated FROM the buildStd*Module() builders and
      # the committed conformance fixtures, so it silently rots as std*.dart and
      # the corpus evolve (issue #172). Regenerate and fail on drift — same
      # generate-and-diff contract as the artifacts above. Runs last so it reads
      # the fixtures the corpus step just confirmed fresh.
      - name: Regenerate std coverage inventory
        run: cd dart/encoder && dart run bin/gen_std_coverage.dart

      - name: Assert std coverage inventory is up to date
        run: |
          if ! git diff --exit-code -- \
              tests/conformance/std_coverage.json \
              tests/conformance/STD_COVERAGE.md; then
            echo "::error::The std coverage inventory is stale. Regenerate with 'cd dart/encoder && dart run bin/gen_std_coverage.dart' and commit — these files are generated (issue #172), never hand-edited."
            exit 1
          fi
          echo "Std coverage inventory is up to date."

  # ──────────────────────────────────────────────────
  # Protobuf Codegen — the protoc-gen-ball / -connect / -grpc plugins
  # (dart/ball_protobuf_gen) + the transport runtime (dart/ball_rpc).
  # Each package is analyzed and tested FROM ITS OWN PACKAGE DIRECTORY
  # (the canonical invocation), after a single workspace `dart pub get`.
  # No Node is needed: these packages never shell out to the TS compiler.
  # ──────────────────────────────────────────────────
  protobuf-codegen:
    name: Protobuf Codegen (gen + rpc)
    needs: changes
    if: ${{ needs.changes.outputs.dart == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      - name: Cache Dart pub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('dart/**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Install dependencies
        run: cd dart && dart pub get

      # ball_protobuf_gen — protoc-gen-ball / -connect / -grpc plugins
      - name: Analyze ball_protobuf_gen
        run: cd dart/ball_protobuf_gen && dart analyze
      - name: Test ball_protobuf_gen
        run: cd dart/ball_protobuf_gen && dart test

      # ball_rpc — Connect + gRPC transport runtime
      - name: Analyze ball_rpc
        run: cd dart/ball_rpc && dart analyze
      - name: Test ball_rpc
        run: cd dart/ball_rpc && dart test

  # ──────────────────────────────────────────────────
  # C++ — build + test on all platforms
  # ──────────────────────────────────────────────────
  cpp:
    name: C++ (${{ matrix.os }})
    needs: changes
    # C++ is build-isolated (does not build from dart/ or ts/). #18 Stage 5: it
    # no longer FetchContents Google protobuf — the build is now libprotobuf-free
    # (nlohmann/json only), so configure + build are dramatically faster. Skip
    # the whole 3-OS matrix when nothing under cpp/ (or proto/, or this workflow)
    # changed.
    if: ${{ needs.changes.outputs.cpp == 'true' || needs.changes.outputs.infra == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Job-time ratchet (#521). This job is the long pole of every PR cycle, and
    # nothing measured it: a 90-minute budget cannot tell a healthy run from a
    # 10x-slower one, so `Run tests` silently grew to 28 minutes on Windows
    # while CI stayed green. Measured on main run 33673078770 (per-step, from
    # `gh api repos/Ball-Lang/ball/actions/jobs/<id>`):
    #   windows-latest  Configure 19s  Build 3m19s  Run tests 28m33s  job 32m35s
    #   ubuntu-latest   Configure  0s  Build    3s  Run tests 12m12s  job 12m32s
    #   macos-latest    Configure  8s  Build    5s  Run tests  9m56s  job 10m40s
    # The budgets below are the post-fix targets; a regression back to serial,
    # uncached fixture compiles fails the job instead of just slowing it down.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1
        with:
          setup_only: true

      # Compiler cache to speed rebuilds. #18 Stage 5 removed the FetchContent
      # protobuf+abseil build (the former dominant cost), but ccache still helps
      # the heavy ball_protobuf_rt.h TU + the compiler's ~12k-line TU. ccache on
      # Linux/macOS, sccache on Windows (MSVC).
      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: cpp-${{ matrix.os }}
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          max-size: 1G

      - name: Install nlohmann-json (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev

      - name: Install nlohmann-json (macOS)
        if: runner.os == 'macOS'
        run: brew install nlohmann-json

      # Windows: nlohmann-json is fetched by CMake FetchContent

      # -DBALL_BUILD_PROTOBUF_RT=ON builds Ball's own compiled protobuf runtime
      # (cpp/shared/ball_protobuf_rt.h) plus a smoke driver that round-trips
      # real values through it, as a standalone, dependency-free proof target —
      # the #18 canary that it keeps building AND working under the toolchain.
      # It links no libprotobuf/abseil, so it adds negligible time next to the
      # FetchContent protobuf build this job already pays for. Enabled on Linux
      # (g++) only for now: that's the toolchain the target has been verified
      # against; extend to macOS (AppleClang) / Windows (MSVC) once each is
      # confirmed green — a broken canary must never take the whole job red.
      - name: Configure CMake
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'Linux' && '-DBALL_BUILD_PROTOBUF_RT=ON' || '' }} -DCMAKE_C_COMPILER_LAUNCHER=${{ runner.os == 'Windows' && 'sccache' || 'ccache' }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}

      - name: Build all targets
        run: cmake --build cpp/build --config Release

      # One place decides the parallelism for `ctest -j` and for the scratch
      # fixture build inside test_e2e (issue #521). `nproc` ships with GNU
      # coreutils on the Linux runner AND with Git for Windows' bash, so the
      # only outlier is macOS, where `sysctl -n hw.ncpu` is the equivalent.
      # Fail loud rather than silently falling back to 1: a serial run is
      # exactly the regression this PR removes, and a silent fallback would
      # reintroduce it invisibly.
      - name: Resolve build parallelism
        id: jobs
        shell: bash
        run: |
          set -euo pipefail
          n="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-}")"
          case "$n" in
            ''|*[!0-9]*|0)
              echo "::error::Could not determine the runner CPU count (got '$n'). Refusing to fall back to a serial build."
              exit 1;;
          esac
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "Runner CPU count: $n"

      # The ONLY install() rule in the C++ tree — cpp/cli/CMakeLists.txt's
      # `install(TARGETS ball RUNTIME DESTINATION bin)`, added by PR #376 for
      # the distribution epic (#368) — was exercised by NOTHING until this step.
      # The build step above runs CMake's DEFAULT target, which does not include
      # the separately-generated `install` target; release-cpp.yml stages the
      # binary with a raw `cp cpp/build/cli/ball` and never calls
      # `cmake --install`; and the vcpkg port that would exercise it has never
      # been built even once (its portfile still carries `SHA512 0 #
      # PLACEHOLDER`). So deleting or mis-targeting that rule produced zero red
      # CI — the same "silent until a human dispatches it manually" class that
      # already bit the macOS release leg (#404). This runs on all three OS legs.
      # `ball version` is real (not a self-host stub) in a plain cmake build.
      - name: Install smoke (exercises install(TARGETS ball) — issue #368)
        shell: bash
        run: |
          set -euo pipefail
          prefix="${RUNNER_TEMP}/ball-install"
          cmake --install cpp/build --config Release --prefix "$prefix"
          bin="$prefix/bin/ball"; [ -f "$bin" ] || bin="$prefix/bin/ball.exe"
          [ -f "$bin" ] || { echo "::error::cmake --install placed no ball binary under $prefix/bin"; exit 1; }
          out="$("$bin" version)"
          [ -n "$out" ] || { echo "::error::installed ball printed nothing for 'ball version'"; exit 1; }
          echo "installed ball version: $out"

      # Delete last run's e2e coverage report BEFORE ctest, so the reporting
      # step below can never pass by reading a stale file. test_e2e truncates
      # and rewrites it on every run; this makes "the file is present" mean
      # "THIS ctest invocation produced it", not "some invocation once did".
      - name: Reset e2e coverage report
        shell: bash
        run: rm -f cpp/build/test/e2e_coverage.txt

      # Step-level budget — the actual ratchet (#521). `Run tests` is dominated
      # by test_e2e, which builds ~269 generated fixture programs in a scratch
      # CMake project. Budget: 20 min on Windows, 8 min on Linux/macOS, against
      # the pre-fix 28m33s / 12m12s / 9m56s in the job comment above.
      #
      # A ratchet has to be sized against the SLOWEST healthy run, not the
      # fastest. With ccache warm the Linux/macOS step is 11s / 19s, but a
      # COLD cache is a normal, blameless event: any PR that touches the
      # Ball->C++ emitter or cpp/shared/include/ball_dyn.h changes all ~269
      # generated TUs, and an Actions cache eviction or a first run on a new
      # key does the same. This PR measured that case on its own run
      # 33698642352 — ubuntu `Run tests` 5m19s with `ccache -s` reporting
      # 22 hits out of 292 cacheable calls, macOS 4m57s. 8 minutes leaves
      # ~50% headroom over 319s/297s while still failing a regression back to
      # the pre-fix serial 12m12s (ubuntu) / 9m56s (macOS); 10+ would stop
      # catching the macOS one. Windows' 20 was derived the same way (13m57s
      # observed cold, ~43% headroom).
      #
      # Windows keeps the loosest budget because MSVC is the outlier, and that
      # is measured rather than assumed. Reproduced locally against MSVC 14.50
      # on 4 jobs (the runner's core count): each generated fixture is a ~278 KB
      # TU pulling 29 standard headers (<regex>, <thread>, ...), the scratch
      # build costs 591s, link is a rounding error at 0.33s per fixture, and the
      # generator does not matter — a Ninja scratch build measured 590s against
      # MSBuild's 591s. ~1000s of compiler front-end CPU spread over 4 cores is
      # the floor for this design, so parallelism alone cannot reach the issue's
      # aspirational "windows 6-10 min"; that needs a compiler cache that works
      # on Windows, or a decision to run a subset of the corpus there. Both are
      # follow-up work (see #521), not something to smuggle into a timing fix.
      #
      # `-j`: every CTest test here is its own process, so they parallelise
      # safely (each test binary owns a distinct temp-path prefix). NOTE this
      # build never registers the per-fixture `selfhost` tests — engine_rt is
      # gitignored and no Dart runs in this job — so `-j` does NOT put the
      # heavy self-host fixtures in contention; regression-gates.yml's
      # `C++ Self-Host Tally`, which does register them, stays deliberately
      # sequential for the reason documented there.
      #
      # `--no-tests=error`: a positive floor. Exit code alone cannot tell
      # "everything passed" from "nothing ran", and a CMake change that stopped
      # registering the tests would otherwise be indistinguishable from green.
      #
      # BALL_E2E_JOBS / BALL_E2E_LAUNCHER are read by cpp/test/test_e2e.cpp for
      # the nested scratch project: build the ~269 fixture targets in parallel,
      # and route their compiles through the same compiler cache as the parent
      # build. The launcher is Linux/macOS only ON PURPOSE — CMake honours
      # <LANG>_COMPILER_LAUNCHER for the Makefile and Ninja generators but the
      # Visual Studio (MSBuild) generator ignores it, so setting it on Windows
      # would claim a cache that is not there. (Measured: the Windows leg of
      # run 33673078770 finished with sccache reporting `Compile requests 0`
      # for the same reason — the parent build's launcher is a no-op there too.
      # Moving the Windows leg to `-G Ninja` would fix both; tracked as
      # follow-up work, deliberately out of scope here.)
      - name: Run tests
        timeout-minutes: ${{ runner.os == 'Windows' && 20 || 8 }}
        env:
          BALL_E2E_JOBS: ${{ steps.jobs.outputs.n }}
          # NB: written as `!= 'Windows' && 'ccache' || ''` on purpose — an
          # empty string is FALSY in a GitHub expression, so the intuitive
          # `== 'Windows' && '' || 'ccache'` would fall through to 'ccache' on
          # Windows and claim a cache MSBuild cannot use.
          BALL_E2E_LAUNCHER: ${{ runner.os != 'Windows' && 'ccache' || '' }}
        run: ctest --test-dir cpp/build --output-on-failure -C Release -j ${{ steps.jobs.outputs.n }} --no-tests=error

      # Make the e2e coverage number VISIBLE on a green run, and re-assert it
      # here (#521). `ctest --output-on-failure` prints nothing for a passing
      # test, so test_e2e's "Fixtures: N expected, N executed" line — the thing
      # proving the parallel scratch build did not quietly drop fixtures — never
      # reached a green log; a number nobody can see is a number nobody checks.
      # test_e2e writes it to cpp/build/test/e2e_coverage.txt (path baked in by
      # cpp/test/CMakeLists.txt) and this step prints it and re-derives the
      # invariant from the file. A missing file means e2e_tests never reached
      # its own summary — which an exit code alone cannot distinguish from
      # success, exactly the failure class `--no-tests=error` covers for CTest.
      # (No `always()`: a FAILING `Run tests` already prints test_e2e's whole
      # stdout via --output-on-failure, mismatch message included. This step
      # exists for the green case, which is the one that was invisible.)
      - name: "C++ e2e fixture coverage"
        shell: bash
        run: |
          set -euo pipefail
          f=cpp/build/test/e2e_coverage.txt
          if [ ! -s "$f" ]; then
            echo "::error::$f is missing or empty — test_e2e never reached its coverage summary, so nothing proves the e2e corpus ran."
            exit 1
          fi
          cat "$f"
          exp="$(sed -n 's/.*= \([0-9][0-9]*\) expected, \([0-9][0-9]*\) executed.*/\1/p' "$f")"
          got="$(sed -n 's/.*= \([0-9][0-9]*\) expected, \([0-9][0-9]*\) executed.*/\2/p' "$f")"
          if [ -z "$exp" ] || [ -z "$got" ]; then
            echo "::error::could not parse the expected/executed counts out of $f"
            exit 1
          fi
          if [ "$exp" != "$got" ] || [ "$got" -lt 1 ]; then
            echo "::error::e2e fixture coverage is $got executed vs $exp expected — fixtures were dropped."
            exit 1
          fi
          echo "C++ e2e coverage OK: $got/$exp fixtures executed."

      # Lean per-PR conformance gate for NEW/CHANGED fixtures only, on the Linux
      # leg (avoids tripling cost across the 3-OS matrix). The full-corpus
      # cpp/test/full_e2e.sh sweep (Ball IR -> native C++ via ball_cpp_compile ->
      # g++ -> run, diffed against golden output) otherwise runs ONLY on
      # push-to-main + weekly, inside conformance-matrix.yml's cpp-compiled job —
      # so a PR-introduced conformance regression on the compiled C++ leg could
      # merge green and only turn red after landing on main (this is exactly how
      # the C++ Compiled leg was red for days post-#302 before anyone noticed).
      # ball_cpp_compile is already built by the "Build all targets" step above,
      # so this adds only the marginal cost of compiling+running the changed
      # fixtures with g++ (seconds to low minutes), NOT a second CMake build.
      # `needs.changes` computed which conformance fixtures this PR added/changed
      # vs the merge-base (or the `ALL` fail-open sentinel when it couldn't
      # determine a diff base) — run full_e2e.sh against just those. See #347.
      - name: "C++ compiled e2e — new/changed fixtures only (closes main-only-leg escape class)"
        if: ${{ runner.os == 'Linux' && needs.changes.outputs.changed_fixtures != '' }}
        # full_e2e.sh compiles one g++ TU per fixture. Same two knobs as
        # test_e2e above (issue #521): compile the fixtures concurrently, and
        # route them through this job's ccache so an unchanged fixture is a
        # cache hit rather than a fresh compile.
        env:
          BALL_E2E_JOBS: ${{ steps.jobs.outputs.n }}
          BALL_E2E_LAUNCHER: ccache
        run: |
          if [ "${{ needs.changes.outputs.changed_fixtures }}" = "ALL" ]; then
            echo "No usable diff base upstream — running the FULL full_e2e.sh sweep."
            bash cpp/test/full_e2e.sh
          else
            echo "Running full_e2e.sh for changed fixtures: ${{ needs.changes.outputs.changed_fixtures }}"
            bash cpp/test/full_e2e.sh --fixtures "${{ needs.changes.outputs.changed_fixtures }}"
          fi

      # ...and when a PR changes NO fixture, run the same harness over a small
      # slice anyway (#521). Before this, full_e2e.sh's parallel worker path had
      # NO required-check coverage at all: the step above is skipped on a PR that
      # touches no fixture (the common case), leaving the dispatch-only
      # conformance-matrix `C++ Compiled` leg — which runs on push-to-main and
      # weekly — as the only thing that ever executed it. A regression in the
      # harness itself (worker dispatch, xargs -P, per-fixture CWD isolation,
      # the corpus-ordered aggregation, the dropped-fixture assertion) would
      # therefore have merged green, which is the same escape class #347 closed
      # for fixture regressions.
      #
      # The slice is DERIVED, not hard-coded: the first four fixtures with a
      # golden, in corpus order. A rename or renumber can never leave a stale
      # stem behind (which full_e2e.sh treats as a hard error, correctly), and
      # four is enough that JOBS>1 genuinely overlaps workers. Cost is four
      # ccache-backed g++ -O0 TUs, seconds — this is a harness smoke, not a
      # conformance gate; the full corpus stays in the matrix leg.
      - name: "C++ compiled e2e — harness smoke (full_e2e.sh parallel path, no fixtures changed)"
        if: ${{ runner.os == 'Linux' && needs.changes.outputs.changed_fixtures == '' }}
        env:
          BALL_E2E_JOBS: ${{ steps.jobs.outputs.n }}
          BALL_E2E_LAUNCHER: ccache
        run: |
          set -euo pipefail
          # Plain glob + loop rather than `ls | head`: with `pipefail`, an
          # early-exiting `head` can SIGPIPE the producer once the corpus
          # outgrows the pipe buffer, turning a healthy run red for no reason.
          smoke=""
          count=0
          for g in tests/conformance/*.expected_output.txt; do
            [ -e "$g" ] || break
            smoke="$smoke $(basename "$g" .expected_output.txt)"
            count=$((count + 1))
            if [ "$count" -ge 4 ]; then break; fi
          done
          if [ "$count" -lt 2 ]; then
            echo "::error::resolved only $count smoke fixture(s) from tests/conformance — cannot exercise the parallel path."
            exit 1
          fi
          echo "Harness smoke over $count fixture(s): $smoke"
          bash cpp/test/full_e2e.sh --fixtures "$smoke"

  # ──────────────────────────────────────────────────
  # vcpkg overlay-port install smoke (issue #368)
  # ──────────────────────────────────────────────────
  # tools/vcpkg-port/ports/ball-lang/ is staged for submission to
  # microsoft/vcpkg, but nothing has ever run vcpkg against it — its portfile
  # still carries `SHA512 0 # PLACEHOLDER`, which is vcpkg's own tell that the
  # recipe has never been resolved or built by any tool, human or automated.
  # This is NOT a regression a gate should have caught: the port was staged
  # deliberately inert. It is new infrastructure, so that an external vcpkg
  # maintainer is not the first person to discover the recipe does not build.
  #
  # It exercises vcpkg_cmake_configure / vcpkg_cmake_install / vcpkg_copy_tools /
  # vcpkg_install_copyright end-to-end — strictly more than the plain
  # `cmake --install` smoke in the cpp job above — and would catch a rename of
  # the `ball` target, a removed `install(TARGETS ball ...)` rule, a dropped
  # BALL_BUILD_* option, or a vcpkg_copy_tools TOOL_NAMES mismatch.
  #
  # The overlay is GENERATED at job time from the real port (only the
  # vcpkg_from_github download block is swapped for a local SOURCE_PATH), so a
  # hand-maintained duplicate cannot rot out of sync with the submission file.
  # The real port files are never modified — the real SHA512 and the version
  # bump stay maintainer-only submission steps.
  #
  # Linux/x64 only for this first cut, matching the existing Linux-only
  # BALL_BUILD_PROTOBUF_RT precedent in the cpp job; Windows/macOS triplets
  # (where MSVC/AppleClang flag interactions under vcpkg's toolchain differ) are
  # a known residual gap that only real upstream review would catch today.
  # Path-filtered on the same signal as the cpp job (cpp/** directly;
  # tools/vcpkg-port/** via `infra`), because it re-runs a full cpp/ CMake
  # configure+build inside vcpkg's sandbox.
  vcpkg:
    name: vcpkg port smoke (x64-linux)
    needs: changes
    if: ${{ needs.changes.outputs.cpp == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Pinned to the 2026.07.29 release tag's commit for reproducibility — a
      # floating microsoft/vcpkg would let an upstream change turn this red with
      # no commit here. Bump deliberately.
      - name: Bootstrap vcpkg (pinned)
        env:
          VCPKG_TAG: "2026.07.29"
          VCPKG_SHA: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$VCPKG_TAG" https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          got="$(git -C "$RUNNER_TEMP/vcpkg" rev-parse HEAD)"
          if [ "$got" != "$VCPKG_SHA" ]; then
            echo "::error::vcpkg tag $VCPKG_TAG resolved to $got, expected $VCPKG_SHA — a moved tag is not a pin"
            exit 1
          fi
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg" version

      - name: Generate the CI overlay port
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/vcpkg-port/make_ci_overlay.py "$RUNNER_TEMP/overlay" "$GITHUB_WORKSPACE"
          # Print the overlay delta for the log. `diff` exits 1 whenever the two
          # files differ, which here is ALWAYS by construction (the overlay
          # swaps the vcpkg_from_github download block for a local SOURCE_PATH),
          # so its status is consumed explicitly instead of being discarded with
          # `|| true`: 1 is the expected case, 0 means the generator silently
          # stopped rewriting anything, and anything else is a broken diff.
          set +e
          delta="$(diff -u tools/vcpkg-port/ports/ball-lang/portfile.cmake "$RUNNER_TEMP/overlay/ball-lang/portfile.cmake")"
          status=$?
          set -e
          case "$status" in
            1)
              echo "--- overlay portfile.cmake differs from the submission port ONLY in the download block:"
              echo "$delta"
              ;;
            0)
              echo "::error::the CI overlay portfile is byte-identical to the submission port — make_ci_overlay.py did not swap the download block, so this smoke would build a downloaded tarball instead of this checkout"
              exit 1
              ;;
            *)
              echo "::error::diff of the overlay portfile failed (exit $status)"
              exit 1
              ;;
          esac

      - name: vcpkg install ball-lang
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          "$RUNNER_TEMP/vcpkg/vcpkg" install ball-lang \
            --overlay-ports="$RUNNER_TEMP/overlay" \
            --triplet x64-linux
          echo "VCPKG_INSTALL_SECONDS=$((SECONDS - start))" >> "$GITHUB_ENV"

      # Mirrors the cpp job's Install-smoke assertions: the tool actually lands
      # where vcpkg_copy_tools put it, and it actually runs.
      - name: Installed-binary smoke
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/vcpkg/installed/x64-linux/tools/ball-lang/ball"
          [ -x "$bin" ] || { echo "::error::vcpkg installed no ball binary at $bin"; exit 1; }
          out="$("$bin" version)"
          [ -n "$out" ] || { echo "::error::vcpkg-installed ball printed nothing for 'ball version'"; exit 1; }
          echo "vcpkg-installed ball version: $out"
          {
            echo "vcpkg overlay-port smoke (issue #368): x64-linux OK"
            echo "- \`ball version\` -> $out"
            echo "- \`vcpkg install\` wall clock: ${VCPKG_INSTALL_SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────
  # Upstream protobuf conformance — drive ball_protobuf's feature-aware codecs
  # through the REAL protobuf conformance_test_runner for the proto2, proto3,
  # and edition2023 TestAllTypes messages (every registered test must pass — no
  # tolerated-failure list). POSIX-only runner (fork/pipe) → Ubuntu.
  # ──────────────────────────────────────────────────
  editions-conformance-upstream:
    name: Upstream Conformance (Editions)
    needs: changes
    # Drives ball_protobuf (Dart) through the C++ conformance_test_runner — so it
    # depends on dart/ and cpp/ (+ proto/). A TS-only PR can't affect it; skip
    # this ~45-min job there.
    if: ${{ needs.changes.outputs.dart == 'true' || needs.changes.outputs.cpp == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      - name: Cache Dart pub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('dart/**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      # ccache makes the protobuf+abseil conformance build a near-instant
      # rebuild on warm runs (this is the slowest job in CI — 45-min budget).
      - name: ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: cpp-conformance
          max-size: 1G

      - name: Install nlohmann-json + ninja
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev ninja-build

      - name: Install dependencies
        run: cd dart && dart pub get

      # Builds only the conformance_test_runner target (protobuf + abseil +
      # conformance harness). It statically links the TestAllTypes* descriptors,
      # so we need not feed it our .proto — it already knows the message types.
      # #18 Stage 5: the default ball build no longer FetchContents protobuf, so
      # building the upstream conformance_test_runner is now gated behind the
      # opt-in BALL_BUILD_UPSTREAM_CONFORMANCE option (which FetchContents
      # protobuf with protobuf_BUILD_CONFORMANCE=ON — see cpp/CMakeLists.txt).
      - name: Configure CMake (conformance runner)
        run: cmake -S cpp -B cpp/build-conformance -G Ninja -DBALL_BUILD_UPSTREAM_CONFORMANCE=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Bounded parallelism (-j 2): an unbounded `-j` spawns dozens of protobuf's
      # huge translation units at once (command_line_interface.cc etc.) and
      # exhausts the runner's memory. Two at a time stays well under 16 GB.
      - name: Build conformance_test_runner
        run: cmake --build cpp/build-conformance --target conformance_test_runner --config Release -j 2

      # The conformance program: builds the descriptor registry (with resolved
      # editions features) from the checked-in FileDescriptorSet and drives our
      # codecs. Compiled to a native exe so the runner spawns it cheaply.
      - name: Compile the conformance program
        run: dart compile exe dart/ball_protobuf/tool/conformance_main.dart -o ball_conformance

      - name: Run upstream conformance (Editions)
        run: |
          set -euo pipefail
          runner=$(find cpp/build-conformance -name conformance_test_runner -type f | head -1)
          if [ -z "$runner" ]; then echo "::error::conformance_test_runner not built"; exit 1; fi
          echo "runner: $runner"
          # The program walks up from CWD (repo root) to find the checked-in
          # FileDescriptorSet, so it needs no args — this runner build takes the
          # test program as the final positional arg (no `--` separator). There
          # is NO tolerated-failure list: the runner exits non-zero on ANY
          # conformance failure, so ball_protobuf must pass every case.
          "$runner" --maximum_edition 2023 \
            ./ball_conformance

  # ──────────────────────────────────────────────────
  # TypeScript — build + test
  # ──────────────────────────────────────────────────
  typescript:
    name: TypeScript
    needs: changes
    if: ${{ needs.changes.outputs.dart == 'true' || needs.changes.outputs.ts == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      - name: Cache Dart pub
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('dart/**/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ts/engine/package-lock.json
            ts/cli/package-lock.json
            ts/compiler/package-lock.json
            ts/shared/package-lock.json

      # Dart is needed to regenerate engine.ball.json for the engine
      # self-host parse test under ts/compiler/test/engine_parse.test.ts.
      - name: Bootstrap Dart workspace
        run: cd dart && dart pub get

      # @ball-lang/shared (protobuf-es generated types; no build step)
      - name: Install @ball-lang/shared deps
        run: cd ts/shared && npm ci
      # Test @ball-lang/shared under its c8 coverage floor (issue #62) — runs
      # `npm test` plus `--check-coverage` so a regression below the measured
      # floor fails CI, not just a silent drop.
      - name: Test @ball-lang/shared (coverage-gated)
        run: cd ts/shared && npm run coverage

      # @ball-lang/engine
      - name: Install @ball-lang/engine deps
        run: cd ts/engine && npm ci
      - name: Build @ball-lang/engine
        run: cd ts/engine && npm run build
      # Coverage-gated (issue #62): `npm run coverage` runs the full `npm test`
      # (conformance corpus + hand-written unit tests) under c8, then enforces
      # the per-package floor via --check-coverage.
      - name: Test @ball-lang/engine (coverage-gated)
        run: cd ts/engine && npm run coverage

      # @ball-lang/cli (depends on the in-repo engine via file:../engine —
      # the engine build above must precede; previously the cli had NO CI
      # gate and shipped built against a stale registry engine)
      - name: Install @ball-lang/cli deps
        run: cd ts/cli && npm ci
      - name: Build @ball-lang/cli
        run: cd ts/cli && npm run build
      # Coverage-gated (issue #62): `npm run coverage` runs the full `npm test`
      # (the black-box subprocess suite in test/cli_test.ts + the dependency-free
      # capability_analyzer/capability_table unit tests) under c8.
      - name: Test @ball-lang/cli (coverage-gated)
        run: cd ts/cli && npm run coverage

      # @ball-lang/compiler (self-host TS-native compiler)
      - name: Install @ball-lang/compiler deps
        run: cd ts/compiler && npm ci
      - name: Build @ball-lang/compiler
        run: cd ts/compiler && npm run build
      # Coverage-gated (issue #62): fixtures + engine parse tests, under c8.
      - name: Test @ball-lang/compiler (fixtures + engine parse, coverage-gated)
        run: cd ts/compiler && npm run coverage

      # Lean per-PR conformance gate for NEW/CHANGED fixtures only. The full
      # ~350-fixture full_e2e.ts sweep (Ball IR -> native TS -> node, diffed
      # against golden output) runs ONLY on push-to-main, inside coverage.yml's
      # TS job -- so a PR-introduced fixture regression could merge green and
      # only turn red after landing on main (this is exactly how fixture 400
      # broke this leg and merged via #337, only caught + fixed later by
      # #345). `needs.changes` computed which conformance fixtures this PR
      # added/changed vs the merge-base (or the `ALL` fail-open sentinel, when
      # it couldn't determine a diff base at all) -- run full_e2e.ts against
      # just those, so a typical PR pays a few seconds instead of the full
      # sweep's minutes, with zero coverage gap: every fixture a PR touches is
      # proven on THIS engine before merge, not just at the next main push.
      - name: "TS compiled (direct) e2e — new/changed fixtures only (closes main-only-leg escape class)"
        if: ${{ needs.changes.outputs.changed_fixtures != '' }}
        run: |
          cd ts/compiler
          if [ "${{ needs.changes.outputs.changed_fixtures }}" = "ALL" ]; then
            echo "No usable diff base upstream — running the FULL full_e2e.ts sweep."
            node --experimental-strip-types test/full_e2e.ts
          else
            echo "Running full_e2e.ts for changed fixtures: ${{ needs.changes.outputs.changed_fixtures }}"
            node --experimental-strip-types test/full_e2e.ts --fixtures="${{ needs.changes.outputs.changed_fixtures }}"
          fi

      # @ball-lang/encoder (TypeScript → Ball)
      - name: Install @ball-lang/encoder deps
        run: cd ts/encoder && npm ci
      - name: Build @ball-lang/encoder
        run: cd ts/encoder && npm run build
      # Coverage-gated (issue #62).
      - name: Test @ball-lang/encoder (coverage-gated)
        run: cd ts/encoder && npm run coverage

  # ──────────────────────────────────────────────────
  # Rust — build + test + fmt + clippy
  # ──────────────────────────────────────────────────
  rust:
    name: Rust
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # rustup ships preinstalled on GitHub-hosted runners. `rustup show`
      # reads rust/rust-toolchain.toml (channel = stable, components =
      # rustfmt + clippy) and installs exactly that pinned toolchain; the
      # explicit component-add below is a fast, idempotent belt-and-braces
      # step in case a runner image ships a stable toolchain without them.
      - name: Install Rust toolchain
        working-directory: rust
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: rust

      # NOTE: the default `--workspace` build/test below leaves the ball-lang-engine
      # `self_host` feature OFF (compiled_engine.rs is a gitignored, generated
      # build artifact), so this part of the job gates only the wrapper
      # foundation. The self-hosted engine — which now COMPILES **and RUNS**
      # (issue #300: hello_world/fibonacci produce Dart-identical output) — is
      # regenerated and exercised in the dedicated step at the end of this job.
      - name: Build
        run: cd rust && cargo build --workspace

      - name: Test
        run: cd rust && cargo test --workspace

      # rustfmt walks every `mod` declaration unconditionally — unlike
      # rustc/clippy it does NOT respect the `#[cfg(feature = "self_host")]`/
      # `#[cfg(feature = "cli_core")]` gates on `pub mod compiled_engine;`
      # (rust/engine/src/lib.rs) / `pub mod compiled_cli;` (rust/cli/src/main.rs),
      # so `cargo fmt --check` errors out on a fresh checkout where those
      # gitignored, generated files (rust/.gitignore) have never been
      # regenerated. A single-newline placeholder satisfies rustfmt's module
      # walk; it is already-formatted (no diff) and never affects the real
      # default-features build/test/clippy above, which skip the modules
      # entirely via the cfg gates and never touch the files.
      - name: Placeholder for gitignored self-hosted modules (rustfmt needs the files to exist)
        run: |
          [ -f rust/engine/src/compiled_engine.rs ] || printf '\n' > rust/engine/src/compiled_engine.rs
          [ -f rust/cli/src/compiled_cli.rs ] || printf '\n' > rust/cli/src/compiled_cli.rs

      - name: Format check
        run: cd rust && cargo fmt --check

      - name: Clippy
        run: cd rust && cargo clippy --workspace --all-targets -- -D warnings

      # ── Self-hosted engine: regenerate + RUN (issue #300) ──
      # The self-hosted engine is a Ball program (dart/self_host/engine.ball.json,
      # itself gitignored) compiled through ball-lang-compiler into the gitignored
      # rust/engine/src/compiled_engine.rs. Regenerate both from source, then run
      # the acceptance programs under `--features self_host` and assert
      # Dart-identical output (hello_world -> "Hello, World!", fibonacci -> "55").
      - name: Setup Dart (for engine.ball.json/cli.ball.json regeneration)
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable
      - name: Regenerate self-hosted engine
        run: |
          dart pub get
          cd dart && dart run compiler/tool/gen_engine_json.dart
          cd ../rust && cargo run -p ball-engine-regen
      - name: Self-host run tests (Dart-identical output)
        run: cd rust && cargo test -p ball-lang-engine --features self_host --test self_host_run

      # Whole-corpus conformance sweep (#40) — drives every
      # tests/conformance/*.ball.json through the self-hosted engine and asserts
      # the canonical `Results: N passed, M failed, T total` line shows every
      # golden-having fixture passing (Dart parity). The 4 golden-less
      # resource-limit/sandbox fixtures (196/197/201/202) are behavioral
      # carve-outs the runner skips, exactly like the Dart runner.
      - name: "Self-host conformance sweep (Results: line)"
        run: |
          cd rust
          set +e
          output=$(cargo test -p ball-lang-engine --features self_host --test self_host_conformance -- --ignored --nocapture 2>&1)
          exit_code=$?
          echo "$output"
          passed=$(echo "$output" | grep -oP 'Results: \K\d+(?= passed)')
          failed=$(echo "$output" | grep -oP ', \K\d+(?= failed)')
          total=$(echo "$output" | grep -oP ', \K\d+(?= total)')
          echo ""
          echo "=== Rust Self-Host ==="
          echo "Results: ${passed:-0} passed, ${failed:-0} failed, ${total:-0} total"
          if [ "$exit_code" != "0" ] || [ "${failed:-1}" != "0" ] || [ "${passed:-0}" -lt 1 ] || [ "${passed}" != "${total}" ]; then
            echo "::error::Rust self-host conformance is not at full parity (expected N passed == T total, 0 failed)"
            exit 1
          fi

      # ── cli-core: regenerate + golden-fixture parity gate (issue #365) ──
      # dart/shared/lib/cli_core.dart's info/validate/tree/audit/version verbs,
      # compiled through ball-lang-compiler into the gitignored
      # rust/cli/src/compiled_cli.rs. Regenerate both from source, then build/test
      # under `--features cli_core`: `tests/cli_core_parity.rs` compares the built
      # `ball` binary's info/validate/tree/audit output against the golden `.txt`
      # files checked into rust/cli/tests/golden/cli_core/ (generated once from the
      # Dart CLI — see that test file's module doc comment for the regen command).
      - name: Regenerate self-hosted cli-core
        run: |
          cd dart && dart run compiler/tool/gen_cli_json.dart
          cd ../rust && cargo run -p ball-cli-regen
      - name: cli-core build + clippy + golden-parity tests
        run: |
          cd rust
          cargo build -p ball-lang-cli --features cli_core
          cargo clippy -p ball-lang-cli --all-targets --features cli_core -- -D warnings
          cargo test -p ball-lang-cli --features cli_core

  # ──────────────────────────────────────────────────
  # C# — build + test + format + self-hosted engine conformance
  # ──────────────────────────────────────────────────
  csharp:
    name: C#
    needs: changes
    if: ${{ needs.changes.outputs.csharp == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # .NET 10 is the current LTS (verified to 2028-11-14); "10.0.x" resolves
      # the latest 10.0 patch, matching csharp/global.json's own
      # rollForward: latestFeature contract (minimum SDK 10.0.100).
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('csharp/Directory.Packages.props', 'csharp/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build csharp/Ball.slnx

      - name: Test
        run: dotnet test csharp/Ball.slnx

      - name: Format check
        run: dotnet format csharp/Ball.slnx --verify-no-changes

      # ── Self-hosted engine: regenerate + RUN (issue #383/#384) ──
      # The self-hosted engine is a Ball program (dart/self_host/engine.ball.pb)
      # compiled through the Phase-4 Ball -> C# compiler into the gitignored
      # csharp/engine/src/CompiledEngine.cs. Regenerate both from source, then
      # build + run the Phase-7 conformance harness's engine leg under
      # -p:SelfHost=true and assert Dart parity — the exact regen chain and
      # division of responsibility documented in csharp/AGENTS.md's
      # "Self-hosted engine" and "Conformance harness" -> "Regen seam for CI"
      # sections, mirroring the rust job's identical regen-then-run shape.
      - name: Setup Dart (for engine.ball.pb regeneration)
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      # compile_engine_cpp.dart writes dart/self_host/engine.ball.pb BEFORE it
      # tries (and, with no C++ compiler built in this job, fails) to emit C++
      # — the trailing failure is expected and harmless here; only the .pb
      # matters (see csharp/AGENTS.md's "Build & Test"). gen_engine_json.dart
      # alone only writes the JSON, which exceeds System.Text.Json's default
      # depth limit for this program, so the .pb must be materialized instead.
      - name: Regenerate engine.ball.pb
        run: |
          dart pub get
          cd dart
          dart run compiler/tool/compile_engine_cpp.dart || true
          test -f self_host/engine.ball.pb

      - name: Regenerate CompiledEngine.cs
        run: dotnet run --project csharp/engine/tool/Ball.Engine.Regen.csproj

      - name: Build self-hosted engine conformance harness
        run: dotnet build csharp/engine/conformance/Ball.Engine.Conformance.csproj -c Release -p:SelfHost=true

      # Whole-corpus conformance sweep (#384) — drives every
      # tests/conformance/*.ball.json through the self-hosted C# engine and
      # asserts the canonical `Results: N passed, M failed, T total` line shows
      # every golden-having fixture passing (Dart parity). Currently
      # "Results: 320 passed, 0 failed, 320 total (4 skipped carve-outs)" — the
      # 4 golden-less resource-limit/sandbox fixtures are behavioral carve-outs
      # the runner skips, exactly like the Dart/Rust runners. Parity-checked
      # (passed == total, failed == 0) rather than a hardcoded count, mirroring
      # the rust job's identical gate, so the corpus can grow without editing
      # this workflow.
      - name: "Self-host conformance sweep (Results: line)"
        run: |
          cd csharp
          set +e
          output=$(dotnet run --project engine/conformance/Ball.Engine.Conformance.csproj -c Release -p:SelfHost=true --no-build -- --leg=engine 2>&1)
          exit_code=$?
          echo "$output"
          passed=$(echo "$output" | grep -oP 'Results: \K\d+(?= passed)')
          failed=$(echo "$output" | grep -oP ', \K\d+(?= failed)')
          total=$(echo "$output" | grep -oP ', \K\d+(?= total)')
          echo ""
          echo "=== C# Self-Host ==="
          echo "Results: ${passed:-0} passed, ${failed:-0} failed, ${total:-0} total"
          if [ "$exit_code" != "0" ] || [ "${failed:-1}" != "0" ] || [ "${passed:-0}" -lt 1 ] || [ "${passed}" != "${total}" ]; then
            echo "::error::C# self-host conformance is not at full parity (expected N passed == T total, 0 failed)"
            exit 1
          fi

  # ──────────────────────────────────────────────────
  # Go — build + vet + gofmt + test + self-hosted engine conformance
  # ──────────────────────────────────────────────────
  go:
    name: Go
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # go.mod pins `go 1.23`; the tree is authored/gofmt'd with the 1.25 line
      # (go1.25.x resolves the latest 1.25 patch). setup-go's built-in cache keys
      # on the committed go.sum files (runtime is stdlib-only, so it has none).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            go/cli/go.sum
            go/compiler/go.sum
            go/encoder/go.sum
            go/engine/go.sum
            go/shared/go.sum

      # The six modules are tied by go/go.work. The workspace-root `./...`
      # pattern isn't valid (go/ is not itself a module), so each build/vet/test
      # enumerates the module subdirs explicitly. The engine's self-host artifact
      # (compiled/compiled_engine.go) is gitignored + `//go:build selfhost`-gated,
      # so a default (no-tag) build stays green on the wrapper foundation alone
      # (go/cli's `run` verb inherits that tag too — a default build compiles and
      # reports a clear rebuild-with-selfhost error only at runtime).
      - name: Build
        run: cd go && go build ./cli/... ./compiler/... ./encoder/... ./engine/... ./runtime/... ./shared/...

      - name: Vet
        run: cd go && go vet ./cli/... ./compiler/... ./encoder/... ./engine/... ./runtime/... ./shared/...

      - name: Format check
        run: |
          cd go
          unformatted=$(gofmt -l cli compiler encoder engine runtime shared)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted Go files — run 'gofmt -w' and commit:"
            echo "$unformatted"
            exit 1
          fi
          echo "All Go sources are gofmt-clean."

      - name: Test
        run: cd go && go test ./cli/... ./compiler/... ./encoder/... ./engine/... ./runtime/... ./shared/...

      # ── External-consumer module resolution (issue #361) — GATING ──
      # Every step above runs inside the full monorepo checkout, where go.work
      # pins every intra-repo dependency back to the local tree — so the defect
      # an outside consumer hits is structurally invisible from this vantage
      # point. #495 added a measurement-only version of this sweep; it reported
      # an honest 2/6 because go/{cli,compiler,encoder,engine}/go.mod each
      # carried a filesystem-relative `replace ... => ../<dep>`, which the Go
      # module proxy can never satisfy (it serves a nested module as its OWN
      # directory tree, never its siblings) and which `go install` rejects
      # outright: "The go.mod file for the module providing named packages
      # contains one or more replace directives."
      #
      # Those replace directives are now gone: each module `require`s its
      # intra-repo dependencies at v0.1.0 (the first published Go module tag
      # set), and go/go.work carries versioned `replace ... v0.1.0 => ./<dep>`
      # pins so local dev/CI keeps resolving against this tree. go.work is never
      # published, so the go.mod files stay proxy-clean.
      #
      # tools/go-module-proxy/smoke.sh proves that end-to-end WITHOUT needing
      # the tags to exist yet: it synthesizes the exact file:// module proxy the
      # `go/<module>/v0.1.0` tags will produce (from the tracked files of this
      # commit, so the module hashes match what proxy.golang.org will compute),
      # then (leg 1) builds each module standalone with no go.work and no
      # siblings, and (leg 2) runs `go install .../go/cli/cmd/ball@v0.1.0` into
      # a clean GOPATH/GOMODCACHE and executes the installed binary against a
      # real conformance fixture. Both legs gate: leg 1 asserts fail == 0 over a
      # non-empty module set (bare-integer counts + a positive floor), leg 2
      # asserts the binary exists and produces output. No continue-on-error —
      # that would reduce the exit 1 to an annotation.
      #
      # After the six tags are pushed, the follow-up is to point the same script
      # at the real proxy (drop the synthesized one) — the assertions stay.
      - name: Go module external-consumer smoke (issue #361)
        shell: bash
        run: |
          set -euo pipefail
          bash tools/go-module-proxy/smoke.sh | tee /tmp/go-proxy-smoke.log
          {
            echo "Go module external-consumer smoke (issue #361):"
            grep -E '^(Results:|go install |ball check )' /tmp/go-proxy-smoke.log
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Self-hosted engine: regenerate + RUN (epic #426 Phase 4) ──
      # The self-hosted engine is a Ball program (dart/self_host/engine.ball.json,
      # itself gitignored) compiled through go/compiler into the gitignored
      # go/engine/compiled/compiled_engine.go. Regenerate both from source, then
      # run the whole conformance corpus under `-tags selfhost` and assert Dart
      # parity — the identical regen-then-run shape as the rust/csharp jobs (see
      # go/engine/AGENTS.md's "Regenerate + run").
      - name: Setup Dart (for engine.ball.json regeneration)
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      # gen_engine_json.dart writes dart/self_host/engine.ball.json; cmd/regen
      # reads it (it prefers engine.ball.pb, absent here, and falls back to the
      # JSON) and compiles it into compiled/compiled_engine.go.
      - name: Regenerate self-hosted engine
        run: |
          dart pub get
          cd dart && dart run compiler/tool/gen_engine_json.dart
          cd ../go/engine && go run ./cmd/regen

      # Whole-corpus conformance sweep — drives every tests/conformance/*.ball.json
      # through the self-hosted Go engine and asserts the canonical
      # `Results: N passed, M failed, T total` line shows every golden-having
      # fixture passing (Dart parity). Currently
      # "Results: 320 passed, 0 failed, 320 total (4 skipped carve-outs)" — the 4
      # golden-less resource-limit/sandbox fixtures are behavioral carve-outs the
      # runner skips, exactly like the Dart/Rust/C# runners. Parity-checked
      # (passed == total, failed == 0) rather than a hardcoded count. `-v` is
      # REQUIRED: without it `go test` caches and discards a passing test's stdout,
      # so the `Results:` line (a plain fmt.Printf) would never reach the log.
      - name: "Self-host conformance sweep (Results: line)"
        run: |
          cd go/engine
          set +e
          output=$(go test -v -tags selfhost -run TestConformance -timeout 3600s ./conformance/ 2>&1)
          exit_code=$?
          echo "$output"
          passed=$(echo "$output" | grep -oP 'Results: \K\d+(?= passed)')
          failed=$(echo "$output" | grep -oP ', \K\d+(?= failed)')
          total=$(echo "$output" | grep -oP ', \K\d+(?= total)')
          echo ""
          echo "=== Go Self-Host ==="
          echo "Results: ${passed:-0} passed, ${failed:-0} failed, ${total:-0} total"
          if [ "$exit_code" != "0" ] || [ "${failed:-1}" != "0" ] || [ "${passed:-0}" -lt 1 ] || [ "${passed}" != "${total}" ]; then
            echo "::error::Go self-host conformance is not at full parity (expected N passed == T total, 0 failed)"
            exit 1
          fi

  # ──────────────────────────────────────────────────
  # Python — pytest + compileall + self-hosted engine conformance
  # ──────────────────────────────────────────────────
  python:
    name: Python
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Every python/*/pyproject.toml declares `requires-python = ">=3.11"` (the
      # floor); CI pins the current 3.13 line — the same "manifest declares the
      # floor, CI runs the latest line" split the go job uses (go.mod `go 1.23`
      # floor vs setup-go `1.25.x`).
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      # The engine loader materialises proto3 defaults through the generated
      # protobuf binding (python/shared/gen), which needs the protobuf runtime;
      # pytest drives the suites. Both pinned to the floors the pyproject /
      # requirements-dev files already declare (protobuf>=5.29, pytest>=8.3,<10).
      - name: Install dependencies
        run: python -m pip install "protobuf>=5.29" "pytest>=8.3,<10"

      # The five packages are isolated (no workspace manager); each suite's
      # conftest.py bootstraps its sibling sources onto sys.path, so every suite
      # runs from its own package dir (the canonical invocation).
      - name: Compiler tests
        run: cd python/compiler && python -m pytest -q

      - name: Encoder tests
        run: cd python/encoder && python -m pytest -q

      # Runs BEFORE the self-host regen below, so compiled_engine.py is absent
      # here and the CLI's honest-failure `run` path (exit 1 + regenerate hint)
      # is actually exercised — the natural state of a fresh checkout.
      - name: CLI tests
        run: cd python/cli && python -m pytest -q

      # Byte-compile every checked-in source as a syntax gate (the Python analog
      # of the go job's build + vet). compiled_engine.py is a gitignored,
      # generated artifact not present at this point; `-x` excludes it
      # defensively so a re-run (where regen already ran) can't slow this to a
      # ~690 KB compile.
      - name: Compile-all (syntax gate)
        run: |
          python -m compileall -q -x 'compiled_engine\.py' \
            python/runtime/ballrt python/compiler/ball_compiler \
            python/encoder/ball_encoder python/engine/ball_engine \
            python/cli/ball_cli python/shared/gen \
            python/tool python/engine/tool

      # ── Self-hosted engine: regenerate + RUN (epic #445 Phase 4) ──
      # The self-hosted engine is a Ball program (dart/self_host/engine.ball.json,
      # itself gitignored) compiled through python/compiler into the gitignored
      # python/engine/ball_engine/compiled_engine.py. Regenerate both from source,
      # then run the whole conformance corpus and assert Dart parity — the
      # identical regen-then-run shape as the go/rust/csharp jobs (see
      # python/engine/AGENTS.md's "Regenerate + run").
      - name: Setup Dart (for engine.ball.json regeneration)
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      # gen_engine_json.dart writes dart/self_host/engine.ball.json; the
      # `ball_engine.regen` module reads it and compiles it into
      # ball_engine/compiled_engine.py.
      - name: Regenerate self-hosted engine
        run: |
          dart pub get
          cd dart && dart run compiler/tool/gen_engine_json.dart
          cd ../python/engine && python -m ball_engine.regen

      # Whole-corpus conformance sweep — drives every tests/conformance/*.ball.json
      # through the self-hosted Python engine and asserts the canonical
      # `Results: N passed, M failed, T total` line shows every golden-having
      # fixture passing (Dart parity). Currently
      # "Results: 320 passed, 0 failed, 320 total (4 skipped carve-outs)" — the 4
      # golden-less resource-limit/sandbox fixtures are behavioral carve-outs the
      # runner skips, exactly like the Dart/Rust/C#/Go runners. Parity-checked
      # (passed == total, failed == 0, passed >= 1) rather than a hardcoded count,
      # mirroring the go/rust/csharp gates byte-for-byte so the corpus can grow
      # without editing this workflow.
      - name: "Self-host conformance sweep (Results: line)"
        run: |
          cd python/engine
          set +e
          output=$(python -m conformance.runner 2>&1)
          exit_code=$?
          echo "$output"
          passed=$(echo "$output" | grep -oP 'Results: \K\d+(?= passed)')
          failed=$(echo "$output" | grep -oP ', \K\d+(?= failed)')
          total=$(echo "$output" | grep -oP ', \K\d+(?= total)')
          echo ""
          echo "=== Python Self-Host ==="
          echo "Results: ${passed:-0} passed, ${failed:-0} failed, ${total:-0} total"
          if [ "$exit_code" != "0" ] || [ "${failed:-1}" != "0" ] || [ "${passed:-0}" -lt 1 ] || [ "${passed}" != "${total}" ]; then
            echo "::error::Python self-host conformance is not at full parity (expected N passed == T total, 0 failed)"
            exit 1
          fi

      # ── The `ball-lang` wheel (issue #496) ──
      # Everything above proves "the checkout works": each suite runs from its own
      # package dir with the sibling sources bootstrapped onto sys.path. A
      # pip-installed distribution is a different thing entirely, and nothing
      # tested it — there was no distribution to install.
      #
      # These two steps run AFTER the self-host regeneration above, because both
      # need dart/self_host/engine.ball.json: the bootstrap tests compile it, and
      # the wheel bundles it as package data (`ball run` in an installed wheel
      # compiles it into a user cache dir on first use — the generated
      # compiled_engine.py is never shipped and never committed).
      #
      # BALL_REQUIRE_SELFHOST_SOURCE=1 turns "no self-host source" from a skip
      # (right on a fresh developer checkout) into a failure here, so the regen
      # step silently not running can't reduce this gate to a no-op.
      - name: Engine bootstrap tests (compile-on-first-use)
        env:
          BALL_REQUIRE_SELFHOST_SOURCE: "1"
        run: cd python/engine && python -m pytest -q

      # Builds the wheel, installs it into a venv OUTSIDE the repo with no repo
      # path on PYTHONPATH, and runs --version / check / compile / encode / run —
      # `run` comparing stdout against the fixture's golden as BYTES. This is
      # deliberately MORE rigorous than the npm/crates/nuget publish paths, which
      # are tag-triggered and have no PR-gated install smoke at all; the asymmetry
      # is intentional, since a broken combining distribution is otherwise
      # invisible until someone pip-installs it.
      - name: Wheel build + clean-venv install smoke
        run: |
          python -m pip install "build>=1.2"
          python python/tool/wheel_smoke.py

  # ──────────────────────────────────────────────────
  # NEW LANGUAGE TEMPLATE — copy and customize when adding a new language
  # ──────────────────────────────────────────────────
  # <lang>:
  #   name: <Lang>
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
  #
  #     # Setup language toolchain (find official action at github.com/actions)
  #     - name: Setup <Lang>
  #       uses: <official-setup-action>
  #       with:
  #         <lang>-version: <stable>
  #
  #     # Proto generation (if bindings are built at compile time)
  #     - uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1
  #       with:
