name: Tag Go modules

# ──────────────────────────────────────────────────
# Go modules — the six `go/<module>/vX.Y.Z` tags (issues #361, #623, #879)
# ──────────────────────────────────────────────────
# The Go module proxy serves each nested module as its own tree, keyed by a
# `go/<module>/vX.Y.Z` tag, and every intra-repo `require` in go/*/go.mod names
# that exact version. So all six tags must land on ONE commit, together, or a
# dependent resolves to a version that does not exist.
#
# WHO DISPATCHES THIS, AND WHEN. Exactly one thing does:
# `tools/release/finish_go_release.sh`, run by the `finish-release` job of
# `.github/workflows/go-release.yml` (Phase 2 of the Go module release lane),
# pinned to the `go-modules/vX.Y.Z` channel tag it has just pushed. The Go
# module version is its own line, computed by a semantic-release DRY RUN over
# the `go/`-path commits (#623), and since #879 it lands through an auto-merged
# PR, never a push to `main`. Phase 1, `tools/release/open_go_release_pr.sh`,
# runs `tools/go-module-proxy/bump_go_modules.sh` on a `release/go-next` branch
# and opens the `chore(release): go vX.Y.Z` PR. Once main's merge queue has
# merged it (as `chore(release): go vX.Y.Z (#N)`), Phase 2 finds that commit,
# tags it `go-modules/vX.Y.Z`, creates the GitHub Release, and dispatches this
# workflow at the tag. That is why the ref carries the bumped go.mod files and
# why the version below is simply read back out of them.
#
# `release.yml` does NOT dispatch this workflow. After a root release it
# dispatches go-release.yml, whose own Phase 2 is what reaches this file. It
# used to dispatch this one directly and version-lessly on every release, which
# re-ran the tagger at whatever number the go.mod files already carried and
# reported success for doing nothing. #623 removed that, and
# `tools/release/check_go_release_wiring.sh` FAILS if it ever comes back, if a
# second dispatcher appears, or if this header stops naming the one that exists
# (#627, #879).
#
# The dispatch is AWAITED (#627). `gh workflow run` returns the moment GitHub
# accepts the request, so finish_go_release.sh dispatches through
# `tools/release/await_workflow_run.py --dispatch`. That polls this run to
# completion on a bounded budget, accepts only a run strictly newer than the
# newest one on the tag before the dispatch (#656), and fails the
# `finish-release` job on any non-success conclusion. A tag cut that fails, is
# cancelled, or never starts reddens the release run that caused it instead of
# leaving it green.
#
# The version is NOT the Dart/Melos release version: the Go modules carry their
# own line (v0.1.0 first, v0.2.0 since #586), single-sourced from the go.mod
# files themselves — build_local_proxy.py --print-version asserts all six agree,
# that no go.mod carries a `replace` directive, that go.work's pins and `use`
# block agree with them, and (in smoke.sh) that the synthesized proxy carries
# exactly this version before printing it.
#
# Tags are IMMUTABLE once fetched through proxy.golang.org / sum.golang.org — a
# moved tag is a checksum mismatch for every consumer that already has it — which
# is why the half-tagged refusal below never papers over a partial set, and why a
# published line is superseded by a NEW version rather than re-cut in place.
#
# Idempotent by construction: if all six tags already exist (which is what a
# re-dispatch of an already-tagged channel tag hits), the job reports and exits
# 0. If only SOME exist, that is a half-published state it refuses to paper over
# — it fails loudly instead.
#
# NOT triggered by `push: branches:[main]` + a `chore(release)` message match.
# This job lived in release-tag.yml behind exactly that gate and never ran once:
# the release commit it waited for carried `[skip ci]`, and GitHub's skip-ci
# recursion protection suppresses the ENTIRE workflow run on such a push — not
# merely the job's own `if:`. No run row is even created, so the dead channel
# read as "nothing red" while five releases shipped with zero `go/**` tags.
# Since #879 a push trigger would be dead for a second reason: the release PR is
# merged by an auto-merge armed with `GITHUB_TOKEN`, and "events triggered by
# the GITHUB_TOKEN will not create a new workflow run", except
# `workflow_dispatch` and `repository_dispatch` (GitHub's "Triggering a
# workflow" docs). workflow_dispatch is exempt from both suppressions, which is
# why this lane uses it.
#
# Whether the tags this cuts are actually SERVED is a separate question, and a
# separate alarm: `.github/workflows/go-freshness.yml` (weekly) asks
# proxy.golang.org whether it lists the version main's go.mod files name.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-go-modules:
    name: Tag Go modules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create the go/<module>/vX.Y.Z tags
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 tools/go-module-proxy/build_local_proxy.py --print-version)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The tagging logic lives in a script so it is unit-tested on every PR
          # (tools/test/test_tag_go_modules.sh, ci.yml `proto` job). The first
          # live dispatch (run 33939440446) failed on `git tag $six_names $sha`
          # -- "fatal: too many arguments" -- because the inline block was never
          # exercised anywhere but this dispatch-only workflow.
          bash tools/go-module-proxy/tag_go_modules.sh "$version" "$GITHUB_SHA" origin
